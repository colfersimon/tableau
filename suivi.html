<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Suivi des résultats</title>
<!-- 30/10 : page autonome du suivi. NE PAS ÉDITER suivi.html : il est refait par construire.py à partir de ce modèle
     + suivi_bloc.css + suivi_bloc.js (le même bloc que l'onglet du simulateur). -->
<style>
:root { color-scheme: light; --page-fond: #f6f5f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --page-fond: #121211; } }
:root[data-theme="dark"] { color-scheme: dark; --page-fond: #121211; }
body { margin: 0; background: var(--page-fond); }
.page { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
.page h1 { font: 700 1.35rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0 0 4px; }
.theme { float: right; font: .8rem -apple-system, sans-serif; border: 1px solid #8884; background: transparent; color: inherit; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
/* 30/10 : bloc « Suivi des résultats » (chantier_3010/suivi). Tout est préfixé suivi- et rangé sous .suivi-racine :
   rien ne fuit dans la page qui l'accueille. Couleurs : jetons --suivi-* (clair, sombre par le système ou data-theme). */
.suivi-racine {
  color-scheme: light;
  --suivi-fond: #f6f5f2; --suivi-carte: #fcfcfb; --suivi-trait: #e4e2dc; --suivi-texte: #0b0b0b; --suivi-texte-2: #52514e;
  --suivi-texte-3: #6e6d68; --suivi-gain: #0f7b3a; --suivi-perte: #c8302f; --suivi-teinte: #eeece6; --suivi-rouge: #d4342f;
  --suivi-s1: #2a78d6; --suivi-s2: #eb6834; --suivi-s3: #1baf7a; --suivi-neutre: #b9b7b0;
  color: var(--suivi-texte); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .suivi-racine {
    color-scheme: dark;
    --suivi-fond: #121211; --suivi-carte: #1a1a19; --suivi-trait: #2e2e2c; --suivi-texte: #f0efec; --suivi-texte-2: #c3c2b7;
    --suivi-texte-3: #8f8e86; --suivi-gain: #3fbf6f; --suivi-perte: #ef6b6a; --suivi-teinte: #242422; --suivi-rouge: #ff7a75;
    --suivi-s1: #3987e5; --suivi-s2: #d95926; --suivi-s3: #199e70; --suivi-neutre: #55544f;
  }
}
:root[data-theme="dark"] .suivi-racine {
  color-scheme: dark;
  --suivi-fond: #121211; --suivi-carte: #1a1a19; --suivi-trait: #2e2e2c; --suivi-texte: #f0efec; --suivi-texte-2: #c3c2b7;
  --suivi-texte-3: #8f8e86; --suivi-gain: #3fbf6f; --suivi-perte: #ef6b6a; --suivi-teinte: #242422; --suivi-rouge: #ff7a75;
  --suivi-s1: #3987e5; --suivi-s2: #d95926; --suivi-s3: #199e70; --suivi-neutre: #55544f;
}
.suivi-racine *, .suivi-racine *::before, .suivi-racine *::after { box-sizing: border-box; }
.suivi-racine h2 { font-size: 1.05rem; margin: 0 0 8px; }
.suivi-racine p { margin: 0; }
.suivi-sous { color: var(--suivi-texte-3); font-size: .8rem; }
.suivi-carte { background: var(--suivi-carte); border: 1px solid var(--suivi-trait); border-radius: 16px; padding: 14px 16px; margin-top: 12px; min-width: 0; }
.suivi-choix { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.suivi-choix button { font: inherit; font-size: .88rem; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--suivi-trait); background: var(--suivi-carte); color: var(--suivi-texte); cursor: pointer; }
.suivi-choix button[aria-pressed="true"] { background: var(--suivi-texte); color: var(--suivi-carte); border-color: var(--suivi-texte); font-weight: 700; }
.suivi-jour { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.suivi-jour button { font: inherit; width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--suivi-trait); background: var(--suivi-carte); color: var(--suivi-texte); cursor: pointer; }
.suivi-jour select { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--suivi-trait); background: var(--suivi-carte); color: var(--suivi-texte); flex: 1; min-width: 0; }
.suivi-diag { font-size: 1.08rem; font-weight: 700; }
.suivi-diag small { display: block; font-weight: 400; color: var(--suivi-texte-2); font-size: .85rem; margin-top: 4px; }
.suivi-tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .suivi-tuiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.suivi-tuile small { display: block; font-size: .72rem; color: var(--suivi-texte-3); text-transform: uppercase; letter-spacing: .04em; }
.suivi-tuile b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.suivi-tuile span { display: block; font-size: .75rem; color: var(--suivi-texte-3); }
.suivi-large { grid-column: 1 / -1; }
.suivi-gain { color: var(--suivi-gain); } .suivi-perte { color: var(--suivi-perte); }
.suivi-ligne { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--suivi-trait); font-variant-numeric: tabular-nums; }
.suivi-ligne.suivi-premiere { border-top: 0; }
.suivi-ligne .suivi-nom { color: var(--suivi-texte-2); }
.suivi-ligne.suivi-total { font-weight: 700; }
.suivi-chance { padding: 10px 0; border-top: 1px solid var(--suivi-trait); }
.suivi-chance.suivi-premiere { border-top: 0; }
.suivi-tete { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.suivi-z { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.suivi-chance p { font-size: .85rem; color: var(--suivi-texte-2); }
.suivi-jauge { position: relative; height: 10px; border-radius: 5px; margin: 8px 0 4px;
  background: linear-gradient(90deg, var(--suivi-perte) 0%, var(--suivi-neutre) 33%, var(--suivi-neutre) 67%, var(--suivi-gain) 100%); }
.suivi-jauge i { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--suivi-texte); box-shadow: 0 0 0 2px var(--suivi-carte); transform: translateX(-2px); }
.suivi-reperes { display: flex; justify-content: space-between; font-size: .68rem; color: var(--suivi-texte-3); }
.suivi-legende { display: flex; gap: 2px 14px; flex-wrap: wrap; font-size: .8rem; color: var(--suivi-texte-2); margin-bottom: 6px; }
.suivi-legende i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.suivi-legende > span { white-space: nowrap; }
.suivi-legende b { font-weight: 650; font-variant-numeric: tabular-nums; }
.suivi-graphe { position: relative; }
.suivi-graphe svg { width: 100%; height: auto; display: block; touch-action: pan-y; overflow: visible; }
.suivi-graphe svg:focus { outline: none; }
.suivi-graphe svg:focus-visible { outline: 2px solid var(--suivi-s1); outline-offset: 2px; border-radius: 6px; }
.suivi-graphe text { font: 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--suivi-texte-3); font-variant-numeric: tabular-nums; }
.suivi-graphe text.suivi-t0 { fill: var(--suivi-texte-2); font-weight: 600; }
.suivi-graphe text.suivi-fin { font-size: 12.5px; font-weight: 650; fill: var(--suivi-texte); }
.suivi-bulle { position: absolute; pointer-events: none; z-index: 2; background: var(--suivi-carte); border: 1px solid var(--suivi-trait); border-radius: 10px; padding: 8px 10px; min-width: 150px;
  font-size: .8125rem; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.suivi-bd { color: var(--suivi-texte-2); margin-bottom: 4px; }
.suivi-br { display: flex; align-items: center; gap: 6px; }
.suivi-br b { margin-left: auto; padding-left: 12px; font-weight: 650; }
.suivi-br i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; flex: none; }
.suivi-racine table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.suivi-racine th, .suivi-racine td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--suivi-trait); }
.suivi-racine th:first-child, .suivi-racine td:first-child { text-align: left; }
.suivi-racine th { font-size: .72rem; color: var(--suivi-texte-3); font-weight: 600; text-transform: uppercase; border-top: 0; }
.suivi-defile { overflow-x: auto; }
.suivi-setup { padding: 8px 0; border-top: 1px solid var(--suivi-trait); font-size: .88rem; }
.suivi-setup.suivi-premiere { border-top: 0; }
.suivi-haut { display: flex; justify-content: space-between; gap: 8px; }
.suivi-bas { color: var(--suivi-texte-2); font-size: .8rem; }
.suivi-c { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.suivi-rouge { color: var(--suivi-rouge); }
.suivi-item { padding: 8px 0; border-top: 1px solid var(--suivi-trait); font-size: .88rem; }
.suivi-item.suivi-premiere { border-top: 0; }
.suivi-item b { font-variant-numeric: tabular-nums; }
.suivi-lex p { font-size: .85rem; color: var(--suivi-texte-2); padding: 3px 0; }
.suivi-lex b { color: var(--suivi-texte); }
.suivi-msg { padding: 14px; border-radius: 12px; background: var(--suivi-teinte); margin-top: 12px; }
.suivi-attente { color: var(--suivi-texte-3); font-style: italic; }
.suivi-ligne b, .suivi-z, .suivi-tuile b { white-space: nowrap; }   /* 30/10 : le « € » ne part jamais seul à la ligne */

/* 25/11 : bloc Objectif 300 €/jour (demande de Simon). Classes préfixées obj- (aucune règle existante ne les touche). */
.obj { margin-bottom: 14px; padding-bottom: 8px; }
.obj-g { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; padding: 10px 22px 4px; }
@media (max-width: 760px) { .obj-g { grid-template-columns: minmax(0, 1fr); } }
.obj-bloc { background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.3)); border: 1px solid rgba(255,255,255,.9); border-radius: 20px; padding: 14px 16px; min-width: 0; }
.obj-t { color: var(--muted); font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.obj-gros { font-family: var(--u); font-weight: 700; font-size: clamp(28px, 4.6vw, 42px); letter-spacing: -.05em; line-height: 1.1; margin-top: 6px; }
.obj-mot { font-size: 13px; color: var(--fg-2); margin-top: 2px; }
.obj-petit { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.obj-petit b { color: var(--fg-2); font-weight: 600; }
.obj-barre { position: relative; height: 10px; border-radius: 999px; background: rgba(16,19,26,.08); margin-top: 12px; overflow: visible; }
.obj-barre > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: linear-gradient(90deg, #7DF9FF, #8A6BFF 60%, #FF7DF0); }
.obj-barre > i.neg { background: var(--neg); opacity: .75; }
.obj-barre > u { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); border-radius: 2px; }
.obj-legb { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 5px; }
.obj-pills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 22px 2px; }
@media (max-width: 760px) { .obj-pills { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 520px) { .obj-simu label { grid-template-columns: minmax(0, 1fr) 64px; } .obj-simu label input { grid-column: 1 / -1; grid-row: 2; } }
.obj-pills div { background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.4)); border: 1px solid rgba(255,255,255,.9); border-radius: 18px; padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.obj-pills span { color: var(--muted); font-size: 12px; }
.obj-pills b { font-family: var(--u); font-weight: 700; font-size: 18px; letter-spacing: -.03em; }
.obj-pills em { font-style: normal; font-size: 12px; color: var(--muted); }
.obj-zone { position: relative; height: clamp(220px, 26vw, 300px); margin: 8px 0 0; }
.obj-zone svg { position: absolute; left: 14px; top: 10px; width: calc(100% - 28px); height: calc(100% - 20px); overflow: visible; display: block; touch-action: pan-y; }
.obj-leg { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 10px 22px 0; font-size: 12.5px; color: var(--fg-2); }
.obj-leg span { display: inline-flex; align-items: center; gap: 7px; }
.obj-leg i { width: 14px; height: 0; border-top: 3px solid; }
.obj-levier { padding: 10px 22px 4px; font-size: 13px; color: var(--fg-2); line-height: 1.6; }
.obj-levier b { font-weight: 600; }
.obj-simu { margin: 10px 22px 6px; padding: 12px 14px; border-radius: 18px; border: 1px dashed var(--line); display: grid; gap: 10px; }
.obj-simu label { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--fg-2); }
.obj-simu input[type=range] { width: 100%; accent-color: #8A6BFF; }
.obj-simu output { text-align: right; font-weight: 600; white-space: nowrap; }
.obj-simu .obj-res { font-size: 13.5px; }
.obj-tab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.obj-tab th { text-align: right; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.obj-tab td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.obj-tab th:first-child, .obj-tab td:first-child { text-align: left; }
.obj-def { overflow-x: auto; padding: 0 14px; }
.obj-sous { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 18px 22px 2px; }
.obj-sous h3 { margin: 0; font-family: var(--u); font-size: 12.5px; font-weight: 500; letter-spacing: -.02em; }
.obj-sous span { color: var(--muted); font-size: 12px; }
.obj-reb { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; padding: 8px 22px 2px; align-items: center; }
@media (max-width: 760px) { .obj-reb { grid-template-columns: minmax(0, 1fr); } }
.obj-reb .obj-gros { font-size: clamp(26px, 4vw, 36px); }
.obj-spark { height: 70px; position: relative; }
.obj-spark svg { width: 100%; height: 100%; display: block; overflow: visible; }
.obj-rec { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 8px 22px 2px; }
@media (max-width: 760px) { .obj-rec { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.obj-rec div { background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.4)); border: 1px solid rgba(255,255,255,.9); border-radius: 18px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.obj-rec span { color: var(--muted); font-size: 11.5px; }
.obj-rec b { font-family: var(--u); font-weight: 700; font-size: 17px; letter-spacing: -.03em; white-space: nowrap; }
.obj-rec em { font-style: normal; font-size: 11.5px; color: var(--muted); }
.obj-pers { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; padding: 8px 22px 2px; }
.obj-p { border-radius: 18px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.9); background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,.35)); min-width: 0; border-left: 4px solid var(--gris); }
.obj-p .obj-t b { color: var(--fg); font-weight: 600; font-size: 13.5px; }
.obj-p .obj-l { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; margin-top: 6px; }
.obj-p .obj-l span { color: var(--muted); }
.obj-p .obj-l b { font-weight: 600; white-space: nowrap; }
.obj-p .obj-barre { height: 7px; margin-top: 6px; }
.obj-note { padding: 6px 22px 10px; font-size: 11.5px; color: var(--dim); line-height: 1.5; }

/* 25/11 : bloc Objectif posé en haut du Suivi. Les règles obj-* viennent de la page Gains (objectif_code.css) ;
   ici : jetons repris de ceux du Suivi, cartes plates, bulle, mode sombre (système ou bouton). */
#objectif { --fg: var(--suivi-texte); --fg-2: var(--suivi-texte-2); --muted: var(--suivi-texte-3); --dim: var(--suivi-texte-3);
  --line: var(--suivi-trait); --line-2: var(--suivi-trait); --neg: var(--suivi-perte); --u: inherit; --gris: var(--suivi-neutre);
  --c1: #5b3fd0; --c5: #c2369f; --halo: var(--suivi-carte); --vise: var(--suivi-texte-3);
  --grille: var(--suivi-trait); --grille0: var(--suivi-texte-3); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) #objectif { --c1: #a08cff; --c5: #ff6fd8; } }
:root[data-theme="dark"] #objectif { --c1: #a08cff; --c5: #ff6fd8; }
#objectif .obj { margin: 4px 0 18px; padding-bottom: 6px; }
#objectif .obj-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
#objectif .obj-h h2 { margin: 0; }
#objectif .obj-h > span { color: var(--suivi-texte-3); font-size: 12px; }
#objectif .obj-g, #objectif .obj-pills, #objectif .obj-leg, #objectif .obj-levier, #objectif .obj-sous, #objectif .obj-reb,
#objectif .obj-rec, #objectif .obj-pers, #objectif .obj-note { padding-left: 0; padding-right: 0; }
#objectif .obj-simu { margin-left: 0; margin-right: 0; }
#objectif .obj-def { padding: 0; }
#objectif .obj-zone svg { left: 0; width: 100%; }
#objectif .obj-bloc, #objectif .obj-pills div, #objectif .obj-rec div, #objectif .obj-p { background: var(--suivi-teinte); border: 1px solid transparent; }
#objectif .obj-p { border-left: 4px solid var(--gris); }
#objectif .obj-barre { background: var(--suivi-trait); }
#objectif .obj-barre > i { background: var(--c1); }
#objectif .obj-barre > i.neg { background: var(--suivi-perte); }
#objectif .obj-simu input[type=range] { accent-color: var(--c1); }
#objectif .pos { color: var(--suivi-gain); } #objectif .neg { color: var(--suivi-perte); }
#objectif .obj-vide { padding: 14px; border-radius: 12px; background: var(--suivi-teinte); margin-top: 10px; color: var(--suivi-texte-2); }
#objectif .obj-pt { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; margin-right: 2px; }
#objectif .obj-bulle { position: absolute; pointer-events: none; background: var(--suivi-carte); color: var(--fg); border: 1px solid var(--suivi-trait);
  box-shadow: 0 10px 26px -12px rgba(0,0,0,.35); font-size: 12px; line-height: 1.55; padding: 9px 12px; border-radius: 12px; white-space: nowrap;
  opacity: 0; transition: opacity .12s; z-index: 3; }
#objectif .obj-bulle.vu { opacity: 1; }
#objectif .obj-bulle .t { font-weight: 600; margin-bottom: 3px; }
#objectif .obj-bulle .l { display: flex; justify-content: space-between; gap: 16px; }
#objectif .obj-bulle .l span { color: var(--fg-2); }
#objectif .obj-bulle .l b { font-weight: 600; }
#objectif .obj-bulle .sep { border-top: 1px solid var(--line); margin: 5px 0 4px; }
@media (prefers-reduced-motion: reduce) { #objectif .obj-bulle { transition: none; } }

</style>
</head>
<body>
<!-- 11/11 : barre commune des pages (Gains, Tableau, Suivi, Simulateur, Commandes ; Gains = accueil depuis le 12/11), ajoutée par publier.py juste après <body>.
     Garde la clé (#...) d'une page à l'autre. Classes préfixées cn- : rien ne se mélange avec le style de la page. -->
<style id="cn-style">
.cn-barre{position:sticky;top:0;z-index:50;margin:0 0 14px;padding:10px 16px;
  background:rgba(250,249,246,.82);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid rgba(0,0,0,.07);font:15px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
.cn-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cn-marque{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em;font-size:17px;color:#16140f;text-decoration:none}
.cn-logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#1f9d63 0%,#0f6e8c 55%,#6b4fd8 100%);
  box-shadow:0 2px 8px rgba(31,157,99,.35);display:inline-block;position:relative}

<script>
/* 30/10 : bloc « Suivi des résultats » (chantier_3010/suivi), branchable n'importe où.
   Usage : SuiviResultats.dessiner(conteneur, donnees)   (donnees = publie/suivi.json, produit par construire.py)
   Aucune librairie, aucun id global : tout se cherche dans le conteneur. Classes CSS : suivi_bloc.css (préfixe suivi-).
   Les choix (compte, période) sont gardés dans localStorage si permis (try/catch : jamais de plantage).
   Brancher dans une autre page (ex. onglet du simulateur), dans cet ordre :
     1. une balise style avec le contenu de suivi_bloc.css ;
     2. une balise script type="application/json" id="donnees-suivi" contenant {} (construire.py la remplit seul) ;
     3. une balise script avec le contenu de ce fichier ;
     4. SuiviResultats.dessiner(conteneur, JSON.parse(document.getElementById("donnees-suivi").textContent)). */
(function () {
  "use strict";
  const PERIODES = [["jour", "Jour", 1], ["sem", "7 jours", 7], ["mois", "30 jours", 30], ["t90", "90 jours", 90], ["m6", "6 mois", 182], ["an", "1 an", 365]];
  // 10/11 : comptes et groupes lus dans les données (D.ordre, D.groupes) ; ceci ne sert que pour d'anciennes données
  const COMPTES = [["simon", "Simon"], ["mathieu", "Mathieu"], ["les2", "Les deux"]];
  const GROUPES_ANCIENS = [{ id: "les2", nom: "Les deux", comptes: ["simon", "mathieu"] }];
  const ADD = ["n", "mises", "net", "jeu", "tapis", "mult", "vt", "vm", "h", "v", "naj", "aj", "aj2", "nhh", "mains", "sdev", "seur", "p2", "nset", "pj2", "j0", "psum", "pm", "g10", "g10a", "nub", "mub"];
  // 10/11 : chiffres qui peuvent manquer (barème inconnu) : null dans UN jour = null pour tout le groupe, jamais 0
  const NUL = ["jeu", "tapis", "mult", "vt", "vm", "pj2", "j0", "psum", "pm"];
  const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const CARTE = { h: "♥", d: "♦", c: "♣", s: "♠" };

  // ---------------------------------------------------------------- petits outils
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const signe = x => x > 0 ? "+" : x < 0 ? "−" : "";
  const nb = (x, d) => x == null || !isFinite(x) ? "–" : signe(x) + Math.abs(x).toFixed(d).replace(".", ",");
  const nbs = (x, d) => x == null || !isFinite(x) ? "–" : (x < 0 ? "−" : "") + Math.abs(x).toFixed(d).replace(".", ",");
  const eur = (x, d) => x == null || !isFinite(x) ? "–" : nb(x, d == null ? 2 : d) + " €";
  const cls = x => x > 0 ? "suivi-gain" : x < 0 ? "suivi-perte" : "";
  const ent = x => Math.round(x).toLocaleString("fr-FR");
  const dateFr = d => d.slice(8, 10) + "/" + d.slice(5, 7);
  const jourSem = d => JOURS[new Date(d + "T12:00:00").getDay()];
  const premier = i => i === 0 ? " suivi-premiere" : "";
  function phi(z) {                                     // loi normale : part des cas sous z
    const t = 1 / (1 + 0.2316419 * Math.abs(z)), y = Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
    const p = y * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
    return z >= 0 ? 1 - p : p;
  }
  function ajouteJours(d, k) { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + k); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
  const cartes = t => !t ? "" : t.split(" ").map(c => "<span class='suivi-c" + ("hd".includes(c[1]) ? " suivi-rouge" : "") + "'>" + (c[0] === "T" ? "10" : c[0]) + CARTE[c[1]] + "</span>").join(" ");

  // ---------------------------------------------------------------- calculs (une seule fonction par notion)
  function vide() { const o = {}; ADD.forEach(k => o[k] = 0); o.mv = {}; o.ma = {}; o.sessions = []; o.pires = []; o.meilleurs = []; return o; }
  function ajoute(a, j, nomCompte) {
    ADD.forEach(k => { if (NUL.includes(k) && j[k] === null) a[k] = null; else if (a[k] !== null) a[k] += j[k] || 0; });
    for (const k in j.mv || {}) a.mv[k] = (a.mv[k] || 0) + j.mv[k];
    for (const k in j.ma || {}) a.ma[k] = (a.ma[k] || 0) + j.ma[k];
    (j.sessions || []).forEach(s => a.sessions.push(Object.assign({ compte: nomCompte }, s)));
    a.pires = a.pires.concat(j.pires || []); a.meilleurs = a.meilleurs.concat(j.meilleurs || []);
    return a;
  }
  // chiffres dérivés d'un groupe de tournois (session, jour, période)
  function calcule(a, B) {
    const r = Object.assign({}, a);
    r.roi = a.mises ? a.net / a.mises : null;
    r.parH = a.h > 0.05 ? a.net / a.h : null;
    r.cev = a.naj ? a.aj / a.naj : null;
    const sd = a.naj > 1 ? Math.sqrt(Math.max(0, (a.aj2 - a.aj * a.aj / a.naj) / (a.naj - 1))) : null;
    r.ic = sd != null ? 1.96 * sd / Math.sqrt(a.naj) : null;
    r.zT = a.vt > 0 ? a.tapis / Math.sqrt(a.vt) : null;
    r.zM = a.vm > 0 ? a.mult / Math.sqrt(a.vm) : null;
    r.zS = a.nhh > 0 && a.p2 > 0 && B && B.sigma ? a.seur / (B.sigma * Math.sqrt(a.p2)) : null;   // en € : signe = signe du montant
    r.setupsEur = a.nhh > 0 ? a.seur : null;
    r.cevHors = r.cev != null && a.nhh > 0 ? r.cev - a.sdev / a.nhh : null;
    r.jeuHors = a.nhh > 0 && a.jeu != null ? a.jeu - a.seur : null;            // = réel sans la chance
    r.couv = a.n ? a.nhh / a.n : 0;
    // 30/10 (relecture) : UN seul « jeu » (hors setups quand les mains sont lues), sa fourchette à 95 %, le point mort
    // de la mise jouée, et la part de chance des cartes quand la cEV sort très au-dessus (ou au-dessous) de la normale
    r.jeuUn = r.jeuHors != null ? r.jeuHors : a.jeu;
    r.chance = r.jeuUn != null ? a.net - r.jeuUn : null;
    r.pm = a.n && a.pm != null ? a.pm / a.n : null;
    const sdT = B && B.sd_aj ? B.sd_aj : sd;
    r.icJeu = sdT && a.pj2 > 0 ? 1.96 * sdT * Math.sqrt(a.pj2) : null;
    r.jeuMoy = B && B.cev_moy != null && a.j0 != null && a.psum != null ? a.j0 + B.cev_moy * a.psum : null;
    r.zCev = sdT && a.naj > 0 && B && B.cev_moy != null ? (r.cev - B.cev_moy) / (sdT / Math.sqrt(a.naj)) : null;
    r.cartes = r.zCev != null && Math.abs(r.zCev) >= 1 && r.jeuMoy != null && a.jeu != null ? a.jeu - r.jeuMoy : null;   // cEV à plus d'1 écart-type de la moyenne
    return r;
  }
  function verdictJeu(c, pm) {                          // pm = point mort de la mise jouée (0,25 € : +45 ; 1-2-5 € : +38)
    if (c == null) return "jeu non mesuré";
    if (pm == null) pm = 38;
    if (c >= pm + 22) return "bon jeu";
    if (c >= pm) return "jeu correct";
    if (c >= 0) return "jeu sous le point mort";
    return "jeu perdant";
  }
  // LA phrase de diagnostic : « Jour perdant à cause des setups (−2,1) et des tapis (−1,4), jeu correct (cEV +70) »
  function diagnostic(r, mot) {
    const e = mot === "Période" ? "e" : "";
    const g = r.net > 0.005 ? mot + " gagnant" + e : r.net < -0.005 ? mot + " perdant" + e : mot + " à zéro";
    // 30/10 (relecture) : en € et en part du gain. « +112 € = 29 € de jeu + 84 € de chance (multiplicateurs +54, ...) »
    let t = (r.incomplet || (r.etat || []).some(e => !e.complet) ? "Jour incomplet · " : "") + g + " : " + eur(r.net, 0);
    if (r.jeuUn == null) t += " · jeu et chance non mesurés (barème inconnu)";            // 10/11 : jamais « 0 € de jeu »
    else {
      t += " = " + nbs(r.jeuUn, 0) + " € de jeu " + (r.chance >= 0 ? "+ " : "− ") + Math.abs(r.chance).toFixed(0) + " € de chance";   // le détail : cartes « chance » juste dessous
      if (Math.abs(r.net) >= 1) t += Math.abs(r.chance) > Math.abs(r.net) / 2 ? " : surtout de la chance" : " : surtout du jeu";
    }
    const c = r.cevHors != null ? r.cevHors : r.cev;
    t += ". " + verdictJeu(c, r.pm)[0].toUpperCase() + verdictJeu(c, r.pm).slice(1) + " (cEV " + nb(c, 0) + ", point mort " + nb(r.pm, 0) + ")";
    if (r.zS == null) t += r.nub && r.nub === r.n ? ", setups non mesurés (Unibet, PokerStars)" : ", setups en attente";
    return t;
  }
  // Benjamini-Hochberg (10 %) sur tous les scores de chance des jours de la période
  function joursHorsNormes(jours, B) {
    const tests = [];
    for (const j of jours) {
      const r = calcule(j, B);
      [["setups", r.zS], ["tapis", r.zT], ["multiplicateurs", r.zM]].forEach(([n, z]) => { if (z != null) tests.push({ d: j.date, n, z, p: 2 * (1 - phi(Math.abs(z))) }); });
    }
    tests.sort((a, b) => a.p - b.p);
    let k = 0;
    tests.forEach((t, i) => { if (t.p <= 0.10 * (i + 1) / tests.length) k = i + 1; });
    return { n: tests.length, retenus: tests.slice(0, k) };
  }

  // ---------------------------------------------------------------- morceaux de page
  function chance(nom, expl, z, euros, i, attente) {
    if (z == null) return "<div class='suivi-chance" + premier(i) + "'><div class='suivi-tete'><b>" + nom + "</b><span class='suivi-z suivi-attente'>" + (attente ? "non mesuré" : "en attente") + "</span></div><p>" + expl + "</p><p class='suivi-attente'>" + (attente || "Mains pas encore lues pour cette période : pas de chiffre (ce n'est pas 0).") + "</p></div>";
    const pos = Math.max(0, Math.min(100, (z + 3) / 6 * 100));
    const mot = Math.abs(z) < 1 ? "normal" : z >= 2 ? "très chanceux" : z >= 1 ? "chanceux" : z <= -2 ? "très malchanceux" : "malchanceux";
    return "<div class='suivi-chance" + premier(i) + "'><div class='suivi-tete'><b>" + nom + "</b><span class='suivi-z " + cls(euros) + "'>" + eur(euros, 0) + "</span></div>" +
      "<div class='suivi-jauge' role='img' aria-label='" + nom + " " + nb(z, 1) + "'><i style='left:" + pos.toFixed(1) + "%'></i></div>" +
      "<div class='suivi-reperes'><span>très malchanceux</span><span>normal</span><span>très chanceux</span></div>" +
      "<p><b>" + mot[0].toUpperCase() + mot.slice(1) + "</b>. " + expl + "</p></div>";
  }
  const SERIES = [["Réel", "net", "var(--suivi-s1)", ""], ["Réel sans la chance (le jeu)", "sans", "var(--suivi-s3)", "6 4"]];
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = " ";
  const eurAxe = v => nbs(v, 0) + NBSP + "€";
  // axe vertical : repères ronds, zéro toujours dedans, un peu d'air sous le plus bas et au-dessus du plus haut
  function echelleCourbe(lo, hi) {
    const span = (hi - lo) || 1, brut = span / 4, p = Math.pow(10, Math.floor(Math.log10(brut))), f = brut / p;
    const pas = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const dmin = lo - span * 0.06, dmax = hi + span * 0.08, ticks = [];
    for (let v = Math.ceil(dmin / pas - 1e-9) * pas; v <= dmax + 1e-9; v += pas) ticks.push(Math.round(v * 1000) / 1000);
    return { ticks, dmin, dmax };
  }
  function courbe(points) {
    if (points.length < 2) return { html: "<p class='suivi-sous'>Courbe : il faut au moins 2 points (2 sessions ou 2 jours).</p>" };
    const cum = {}; SERIES.forEach(s => { let t = 0; cum[s[1]] = [0].concat(points.map(p => (t += (p[s[1]] == null ? NaN : p[s[1]])))); });
    const finale = s => { const v = cum[s[1]]; return v.slice(1).every(isFinite) ? v[v.length - 1] : null; };   // série incomplète (setups en attente) : pas tracée
    const leg = "<div class='suivi-legende'>" + SERIES.map(s => { const f = finale(s);
      return "<span><i style='border-color:" + s[2] + ";border-top-style:" + (s[3] ? "dashed" : "solid") + "'></i>" + s[0] + " <b class='" + (f === null ? "suivi-attente" : cls(f)) + "'>" + (f === null ? "en attente" : eur(f)) + "</b></span>"; }).join("") + "</div>";
    return { html: leg + "<div class='suivi-graphe'><div class='suivi-bulle'></div></div>", points, cum, finale };
  }
  // Dessin à la vraie largeur de la carte (pas d'étirement), refait si la fenêtre change ; survol ou toucher = jour + montants.
  function brancherBulle(racine, c) {
    if (racine._ro) { racine._ro.disconnect(); racine._ro = null; }
    if (racine._hors) { document.removeEventListener("pointerdown", racine._hors); racine._hors = null; }
    const g = racine.querySelector(".suivi-graphe"); if (!g || !c.points) return;
    const b = g.querySelector(".suivi-bulle"), pts = c.points, n = pts.length, sv = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
    const tracees = SERIES.filter(s => c.finale(s) !== null);
    const tous = [].concat(...tracees.map(s => c.cum[s[1]])).concat([0]);
    const ech = echelleCourbe(Math.min(...tous), Math.max(...tous));
    let largeur = 0, actuel = -1;
    function dessiner() {
      const W = Math.max(280, Math.round(g.clientWidth || 340)); if (W === largeur) return; largeur = W;
      const vieux = g.querySelector("svg"); if (vieux) vieux.remove();
      b.style.display = "none"; actuel = -1;
      const tel = W < 520, H = tel ? 240 : 290;
      const fins = tracees.map(s => eur(c.finale(s)));
      const lw = Math.max(4, ...fins.map(t => t.length)), yl = Math.max(...ech.ticks.map(t => eurAxe(t).length));
      const m = { l: Math.round(14 + yl * 6.4), r: Math.round(14 + lw * 7.2), t: 14, b: 34 };
      const pw = W - m.l - m.r, ph = H - m.t - m.b;
      const X = i => m.l + pw * i / n, Y = v => m.t + ph * (1 - (v - ech.dmin) / (ech.dmax - ech.dmin));
      const svg = sv("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, role: "img", tabindex: 0,
        "aria-label": "Courbe cumulée en euros : " + SERIES.map(s => s[0] + " " + (c.finale(s) === null ? "en attente" : eur(c.finale(s)))).join(", ") + ". Flèches gauche et droite pour parcourir." });
      // grille fine, zéro net
      ech.ticks.forEach(t => {
        if (t !== 0) svg.appendChild(sv("line", { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), stroke: "var(--suivi-trait)", "stroke-width": 1 }));
        const tx = sv("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", class: t === 0 ? "suivi-t0" : "" }); tx.textContent = eurAxe(t); svg.appendChild(tx);
      });
      svg.appendChild(sv("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: "var(--suivi-texte-3)", "stroke-width": 1.5 }));
      // noms des points en bas : un sur k selon leur longueur, le dernier toujours écrit, jamais collés
      const ecart = pw / n, wmax = Math.max(...pts.map(p => String(p.nom).length)) * 6.3, k = Math.max(1, Math.ceil((wmax + 12) / ecart));
      for (let i = n; i >= 1; i -= k) {
        const nom = String(pts[i - 1].nom), demi = nom.length * 3.15, xi = X(i);
        svg.appendChild(sv("line", { x1: xi, x2: xi, y1: H - m.b, y2: H - m.b + 4, stroke: "var(--suivi-texte-3)", "stroke-width": 1 }));
        const tl = sv("text", { x: Math.max(demi + 2, Math.min(W - demi - 2, xi)), y: H - 10, "text-anchor": "middle" }); tl.textContent = nom; svg.appendChild(tl);
      }
      // courbes, points de fin, valeur finale (décalée de 9 px au plus si deux valeurs se touchent, sinon omise : la légende la porte)
      const bouts = [];
      tracees.forEach((s, j) => {
        const v = c.cum[s[1]];
        svg.appendChild(sv("polyline", { fill: "none", stroke: s[2], "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": s[3],
          points: v.map((y, i) => X(i).toFixed(1) + "," + Y(y).toFixed(1)).join(" ") }));
        bouts.push({ s, y: Y(v[n]), txt: fins[j] });
      });
      bouts.forEach(o => svg.appendChild(sv("circle", { cx: X(n), cy: o.y, r: 5, fill: o.s[2], stroke: "var(--suivi-carte)", "stroke-width": 2 })));
      let dernierY = -1e9;
      bouts.slice().sort((a, z) => a.y - z.y).forEach(o => {
        let y = o.y; const pousse = dernierY + 15 - y;
        if (pousse > 0) { if (pousse > 9) return; y += pousse; }
        dernierY = y;
        const tx = sv("text", { x: X(n) + 11, y: y + 4, class: "suivi-fin" }); tx.textContent = o.txt; svg.appendChild(tx);
      });
      // survol / toucher
      const cur = sv("line", { y1: m.t, y2: H - m.b, stroke: "var(--suivi-texte-3)", "stroke-width": 1, visibility: "hidden" }); svg.appendChild(cur);
      const ronds = tracees.map(s => { const r = sv("circle", { r: 4.5, fill: s[2], stroke: "var(--suivi-carte)", "stroke-width": 2, visibility: "hidden" }); svg.appendChild(r); return r; });
      const sur = sv("rect", { x: m.l - 12, y: 0, width: pw + 24, height: H, fill: "transparent" }); svg.appendChild(sur);
      g.insertBefore(svg, b);
      function cacher() { actuel = -1; cur.setAttribute("visibility", "hidden"); b.style.display = "none"; ronds.forEach(r => r.setAttribute("visibility", "hidden")); }
      function aller(i) {
        i = Math.max(1, Math.min(n, i)); actuel = i;
        const r = svg.getBoundingClientRect(), echelle = r.width / W, xc = X(i);

          r.sessions.map(s => { const c = calcule(Object.assign(vide(), s), B); return "<tr><td>" + esc((deux ? s.compte + " " : "") + (s.id === "hors session" ? "fin de session pas encore rangée" : s.debut + (s.direct ? " (résumé)" : ""))) + "</td><td>" + s.n + "</td><td class='" + cls(s.net) + "'>" + nb(s.net, 1) + "</td><td>" + nb(c.jeuUn, 1) + "</td><td>" + (c.setupsEur == null ? "<span class='suivi-attente'>" + (s.nub ? "non mesuré" : "attente") + "</span>" : nb(c.setupsEur, 1)) + "</td><td>" + nb(s.tapis, 1) + "</td><td>" + nb(s.mult, 1) + "</td><td>" + nb(c.cev, 0) + "</td></tr>"; }).join("") +
          "</table></div><p class='suivi-sous'>En €. Jeu = hors setups. Sur téléphone, faire glisser le tableau de côté.</p></div>";
      } else {
        const bh = joursHorsNormes(jours, B);
        h += "<div class='suivi-carte'><h2>Jour par jour</h2>" + jours.slice().reverse().map((j, i) => "<div class='suivi-item" + premier(i) + "'><b>" + jourSem(j.date) + " " + dateFr(j.date) + " · <span class='" + cls(j.net) + "'>" + eur(j.net) + "</span></b> · " + j.n + " tournois<br>" + esc(diagnostic(calcule(j, B), "Jour")) + "</div>").join("") +
          "<p class='suivi-sous' style='margin-top:8px'>Vraiment hors normes après correction pour " + bh.n + " tests (méthode Benjamini-Hochberg, 10 %) : " +
          (bh.retenus.length ? bh.retenus.map(t => dateFr(t.d) + " " + t.n + " (" + nb(t.z, 1) + ")").join(", ") : "aucun. Les écarts vus restent dans ce que le hasard produit sur autant de jours.") + "</p></div>";
      }
      h += "<div class='suivi-carte'><h2>Multiplicateurs : tirés contre attendus</h2>" + multiplicateurs(r, sites, D.baremes) + "</div>";
      // 30/10 : lexique retiré (demande de Simon)
      h += etatComptes();
      C.innerHTML = h;
      brancherBulle(racine, cb);
    }
    q("date").onchange = e => { etat.date = e.target.value; rendu(); };
    const pas = k => { const ds = toutesDates(), i = ds.indexOf(etat.date) + k; if (i >= 0 && i < ds.length) { etat.date = ds[i]; rendu(); } };
    q("avant").onclick = () => pas(-1);
    q("apres").onclick = () => pas(1);
    rendu();
  }

  window.SuiviResultats = { dessiner, calcule, diagnostic };
})();

</script>
<script>
/* 25/11 : bloc « Objectif 300 € par jour » EN HAUT DU SUIVI (déplacé de la page Gains, demande de Simon : « sinon ça fait
   trop » sur Gains). Le calcul reste UNIQUE : global/gains/objectif.py, dans les données de la page Gains (gains.enc,
   refaites toutes les 2 min, même clé que le Suivi). Ce bloc ne calcule rien, sauf le petit simulateur.
   Page fabriquée par construire.py assembler() : objectif_bloc_tete.js + objectif_code.js + objectif_bloc_pied.js. */
(function () {
  "use strict";
  const DONNEES_OBJ = "https://raw.githubusercontent.com/colfersimon/tableau/donnees/gains.enc";
  const racine = document.getElementById("objectif");
  if (!racine) return;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const f2 = new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const f0 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  const f1 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
  const signe = x => x > 0.004 ? "+" : x < -0.004 ? "−" : "";
  const eur = x => x == null ? "–" : signe(x) + f2.format(Math.abs(x)) + "\u00a0€";
  const eurA = x => x == null ? "–" : f2.format(Math.abs(x)) + "\u00a0€";
  const eurC = x => x == null ? "–" : signe(x) + f0.format(Math.abs(x)) + "\u00a0€";
  const cls = x => x == null ? "nul" : x > 0.004 ? "pos" : x < -0.004 ? "neg" : "nul";
  const JS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const MOIS = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
  const dcourt = s => { const d = new Date(s + "T12:00:00"); return JS[d.getDay()] + " " + s.slice(8, 10) + "/" + s.slice(5, 7); };
  const ddm = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) : "";
  const css = n => getComputedStyle(racine).getPropertyValue(n).trim();
  const sombre = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const pt = coul => `<span class="obj-pt" style="background:${coul}"></span>`;
  let D = null, couleurs = {}, cpt = {};
  const couleurCompte = c => (c && c.titulaire && couleurs[c.titulaire]) || (c && c.regle === "simon" ? couleurs.simon : css("--gris"));
  function preparer() {
    couleurs = {}; cpt = {};
    for (const p of D.personnes || []) couleurs[p.id] = (sombre() && p.couleur_sombre) || p.couleur || css("--gris");
    for (const c of D.comptes || []) cpt[c.id] = c;
  }
  function echelle(mn, mx, n) {
    if (mn === mx) { mn -= 1; mx += 1; }
    const brut = (mx - mn) / n, p = Math.pow(10, Math.floor(Math.log10(brut))), m = brut / p;
    const pas = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
    const a = Math.floor(mn / pas) * pas, b = Math.ceil(mx / pas) * pas, ticks = [];
    for (let v = a; v <= b + pas / 2; v += pas) ticks.push(+v.toFixed(6));
    return { a, b, ticks };
  }
  function grille(sc, Y, larg, W) {
    return sc.ticks.map(v => `<line x1="0" x2="${larg}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${Math.abs(v) < 1e-9 ? css("--grille0") : css("--grille")}" stroke-width="1"${Math.abs(v) < 1e-9 ? "" : ' stroke-dasharray="2 4"'}/>` +
      `<text x="${W}" y="${(Y(v) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="${css("--muted")}">${Math.abs(v) < 1e-9 ? "0 €" : eurC(v)}</text>`).join("");
  }
  function placer(b, zone, x, y) {
    const W = zone.clientWidth, bw = b.offsetWidth, bh = b.offsetHeight;
    let left = x + 16; if (left + bw > W) left = x - bw - 16; if (left < 0) left = Math.max(0, Math.min(W - bw, x - bw / 2));
    let top = y - bh / 2; top = Math.max(-8, Math.min(top, zone.clientHeight - bh + 8));
    b.style.left = left + "px"; b.style.top = top + "px";
  }
  const evXY = (ev, el) => { const r = el.getBoundingClientRect(), s = ev.touches ? ev.touches[0] : ev; return [s.clientX - r.left, s.clientY - r.top, r]; };

  // ---------------------------------------------------------------- 25/11 : objectif 300 €/jour (calcul : gains/objectif.py)
  const OBJ_SIMU = { ts: 100, cev: 0 };
  function dessinerObjectif() {

        <div class="obj-petit">Gagné : <b class="${cls(J.reel)}">${eur(J.reel)}</b> · attendu à ce stade : <b>${eurA(J.objectif_moment)}</b><br>Théorique (cEV) : <b class="${cls(J.theorique)}">${eur(J.theorique)}</b></div></div>`;
    } else {
      h += `<div class="obj-bloc"><div class="obj-t"><span>Aujourd'hui</span></div><div class="obj-petit">Rien de joué aujourd'hui pour l'instant.</div></div>`;
    }
    const nomMois = MOIS[+M.mois.slice(5, 7) - 1];
    h += `<div class="obj-bloc"><div class="obj-t"><span>Ce mois · ${esc(nomMois)}</span><span>${M.jours_passes} jours finis sur ${M.jours}</span></div>
      <div class="obj-gros ${cls(M.ecart)}">${eurC(M.ecart)}</div><div class="obj-mot">${enRetard(M.ecart)} sur le mois</div>
      ${barre(M.reel, M.objectif_moment, M.objectif)}<div class="obj-legb"><span>0 €</span><span>${f0.format(M.objectif)} €</span></div>
      <div class="obj-petit">Gagné : <b class="${cls(M.reel)}">${eurC(M.reel)}</b> · attendu à ce stade : <b>${f0.format(M.objectif_moment)}&nbsp;€</b><br>
      Fin de mois au rythme actuel : <b>${eurC(M.projection_reel)}</b> réel · <b>${eurC(M.projection_theorique)}</b> théorique</div></div></div>`;
    h += `<div class="obj-pills">
      <div><span>On gagne en ce moment</span><b class="${cls(R.reel_mois)}">${eurC(R.reel_mois)}<em> / mois</em></b><em>${eurC(R.reel_jour)} par jour, réel</em></div>
      <div><span>On est censé gagner</span><b class="${cls(R.theorique_mois)}">${eurC(R.theorique_mois)}<em> / mois</em></b><em>${eurC(R.theorique_jour)} par jour, d'après la cEV</em></div>
      <div><span>Objectif</span><b>${f0.format(R.objectif_mois)} €<em> / mois</em></b><em>${f0.format(O.par_jour)} € par jour</em></div></div>`;
    h += `<div class="obj-leg"><span><i style="border-color:${css("--fg")};border-top-style:dashed"></i>Objectif</span><span><i style="border-color:${css("--c1")}"></i>Réel</span><span><i style="border-color:${css("--c5")};border-top-style:dotted"></i>Théorique (cEV)</span><span><i style="border-color:${css("--gris")};border-top-style:dashed"></i>Fin de mois au rythme réel</span></div>
      <div class="obj-zone" id="obj-zone"><svg id="obj-svg" role="img" aria-label="Cumul du mois : réel, théorique et objectif"></svg><div class="obj-bulle" id="obj-bulle"></div></div>`;
    if (R.euros_par_tournoi_cible) {
      h += `<div class="obj-levier">Pour faire <b>${f0.format(O.par_jour)} € par jour</b>, il faut <b>${f2.format(R.euros_par_tournoi_cible)} € par tournoi</b> sur ~${f0.format(R.tournois_jour)} tournois.
        En ce moment : <b>${f2.format(R.euros_par_tournoi)} €</b> réel, <b>${f2.format(R.euros_par_tournoi_theorique)} €</b> théorique.

    if (O.rebours) {
      const B = O.rebours, fini = B.manque_jour <= 0;

      `</tbody></table></div>`;
    h += `<div class="obj-note">Rythme du jour = tournois joués : à chaque tournoi joué, l'objectif du moment monte de ${R.euros_par_tournoi_cible ? f2.format(R.euros_par_tournoi_cible) : "–"} €. Théorique = ce que vaut la cEV en euros (même modèle que le simulateur : point mort vers 38 de cEV).

  function dessinerObjSpark() {

    const W = svg.clientWidth || 640, H = Math.max(180, svg.clientHeight || 220), bas = 20, droite = 58, n = M.jours;
    const ks = M.courbe, dern = ks[ks.length - 1], jDern = +dern.date.slice(8, 10);
    const v = [0, M.objectif, M.projection_reel, M.projection_theorique, ...ks.map(k => k.cumul_reel), ...ks.map(k => k.cumul_theorique)];
    const sc = echelle(Math.min(0, ...v), Math.max(...v), 4), larg = W - droite;
    const X = d => (d / n) * larg, Y = x => 6 + (H - bas - 6) * (1 - (x - sc.a) / (sc.b - sc.a));
    const pts = key => "M" + X(0).toFixed(1) + "," + Y(0).toFixed(1) + ks.map(k => " L" + X(+k.date.slice(8, 10)).toFixed(1) + "," + Y(k[key]).toFixed(1)).join("");
    const lab = (d) => `${String(d).padStart(2, "0")}/${M.mois.slice(5, 7)}`;
    let s = grille(sc, Y, larg, W);
    s += `<path d="M${X(0)},${Y(0)} L${X(n)},${Y(M.objectif)}" stroke="${css("--fg")}" stroke-width="1.5" stroke-dasharray="6 5" fill="none" opacity=".7"/>`;
    s += `<path d="M${X(jDern)},${Y(dern.cumul_reel)} L${X(n)},${Y(M.projection_reel)}" stroke="${css("--gris")}" stroke-width="2" stroke-dasharray="3 5" fill="none"/>`;
    s += `<path d="${pts("cumul_theorique")}" stroke="${css("--c5")}" stroke-width="2.2" stroke-dasharray="1 4" stroke-linecap="round" fill="none"/>`;
    s += `<path d="${pts("cumul_reel")}" stroke="${css("--c1")}" stroke-width="2.6" fill="none" stroke-linejoin="round"/>`;
    s += `<circle cx="${X(jDern)}" cy="${Y(dern.cumul_reel)}" r="4" fill="${css("--c1")}" stroke="${css("--halo")}" stroke-width="2"/>`;
    s += `<text x="${X(n)}" y="${(Y(M.objectif) - 6).toFixed(1)}" text-anchor="end" font-size="11" fill="${css("--muted")}">objectif ${f0.format(M.objectif)} €</text>`;
    s += [1, Math.ceil(n / 2), n].map((d, i) => `<text x="${X(d).toFixed(1)}" y="${H - 2}" font-size="11" fill="${css("--muted")}" text-anchor="${i === 0 ? "start" : i === 2 ? "end" : "middle"}">${lab(d)}</text>`).join("");
    s += `<line id="obj-v" y1="6" y2="${H - bas}" stroke="${css("--vise")}" stroke-dasharray="3 3" opacity="0"/><rect id="obj-z" x="0" y="0" width="${larg}" height="${H}" fill="transparent"/>`;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = s;
    const bulle = $("obj-bulle"), ligne = $("obj-v");
    const montrer = ev => {
      const [cx, cy, r] = evXY(ev, svg), d = Math.round(cx * W / r.width / larg * n);
      const k = ks.reduce((best, x) => Math.abs(+x.date.slice(8, 10) - d) < Math.abs(+best.date.slice(8, 10) - d) ? x : best, ks[0]);
      const dx = X(+k.date.slice(8, 10));
      ligne.setAttribute("x1", dx); ligne.setAttribute("x2", dx); ligne.setAttribute("opacity", "1");
      bulle.innerHTML = `<div class="t">${dcourt(k.date)}${k.en_cours ? " · en cours" : ""}</div>
        <div class="l"><span>Jour réel</span><b class="${cls(k.reel)}">${eur(k.reel)}</b></div><div class="l"><span>Jour théorique</span><b class="${cls(k.theorique)}">${eur(k.theorique)}</b></div>
        <div class="sep"></div><div class="l"><span>Cumul réel</span><b>${eurC(k.cumul_reel)}</b></div><div class="l"><span>Cumul théorique</span><b>${eurC(k.cumul_theorique)}</b></div>
        <div class="l"><span>Objectif</span><b>${eurC(k.cumul_objectif)}</b></div><div class="l"><span>Écart</span><b class="${cls(k.cumul_reel - k.cumul_objectif)}">${eurC(k.cumul_reel - k.cumul_objectif)}</b></div>`;
      bulle.classList.add("vu");
      placer(bulle, zone, dx * r.width / W, cy + 10);
    };
    const z = $("obj-z");
    z.addEventListener("mousemove", montrer); z.addEventListener("touchstart", montrer, { passive: true }); z.addEventListener("touchmove", montrer, { passive: true });
    z.addEventListener("mouseleave", () => { bulle.classList.remove("vu"); ligne.setAttribute("opacity", "0"); });
  }

  // ---------------------------------------------------------------- chargement (même clé et même format que le Suivi)
  function cleDuLien() {
    const h = location.hash.replace(/^#/, "").replace(/-/g, "+").replace(/_/g, "/");
    try { const k = b64(h + "===".slice((h.length + 3) % 4)); return k.length === 64 ? k : null; } catch (e) { return null; }
  }
  async function dechiffrer(cle, texte) {
    const d = JSON.parse(texte), iv = b64(d.iv), ct = b64(d.ct), mac = b64(d.mac);
    const kMac = await crypto.subtle.importKey("raw", cle.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const tout = new Uint8Array(iv.length + ct.length); tout.set(iv); tout.set(ct, iv.length);
    if (!await crypto.subtle.verify("HMAC", kMac, mac, tout)) throw new Error("clé fausse");
    const kAes = await crypto.subtle.importKey("raw", cle.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, kAes, ct)));
  }
  racine.innerHTML = `<div class="suivi-carte obj"><div class="obj-h"><h2>Objectif <span id="obj-par-jour">300 €</span> par jour</h2><span id="obj-maj"></span></div>
    <div id="obj-corps"><div class="obj-vide">Chargement de l'objectif…</div></div></div>`;
  function dessiner() { preparer(); dessinerObjectif(); }
  async function charger() {
    const q = new URLSearchParams(location.search), local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const essai = local && q.get("objectif");                       // essais sur ce Mac seulement (fichier en clair)
    if (essai) return (await fetch(essai + "?t=" + Date.now(), { cache: "no-store" })).json();
    const cle = cleDuLien();
    if (!cle) throw new Error("pas de clé");
    const r = await fetch(DONNEES_OBJ + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return dechiffrer(cle, await r.text());
  }
  async function boucle() {
    try {
      const x = await charger();
      if (!D || x.fait !== D.fait) { D = x; dessiner(); }
    } catch (e) {
      if (!D) $("obj-corps").innerHTML = `<div class="obj-vide">Objectif pas encore lisible (${esc(e.message)}). Nouvel essai dans 2 minutes.</div>`;
    }
    setTimeout(boucle, 120000);
  }
  const bt = document.getElementById("theme");                       // bouton clair / sombre du Suivi : redessiner aux bonnes couleurs
  if (bt) bt.addEventListener("click", () => setTimeout(() => { if (D) dessiner(); }, 0));
  let attente = null;
  addEventListener("resize", () => { clearTimeout(attente); attente = setTimeout(() => { if (D) dessiner(); }, 250); });
  boucle();
})();

</script>
<script>
(function () {
  "use strict";
  const DONNEES = "https://raw.githubusercontent.com/colfersimon/tableau/donnees/suivi.enc";
  const zone = document.getElementById("suivi");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  function cleDuLien() {
    const h = location.hash.replace(/^#/, "").replace(/-/g, "+").replace(/_/g, "/");
    try { const k = b64(h + "===".slice((h.length + 3) % 4)); return k.length === 64 ? k : null; } catch (e) { return null; }
  }
  async function dechiffrer(cle, texte) {          // même format que le lien fixe (AES-256-CBC + HMAC-SHA256)
    const d = JSON.parse(texte), iv = b64(d.iv), ct = b64(d.ct), mac = b64(d.mac);
    const kMac = await crypto.subtle.importKey("raw", cle.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const tout = new Uint8Array(iv.length + ct.length); tout.set(iv); tout.set(ct, iv.length);
    if (!await crypto.subtle.verify("HMAC", kMac, mac, tout)) throw new Error("clé fausse");
    const kAes = await crypto.subtle.importKey("raw", cle.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, kAes, ct)));
  }
  const message = t => { zone.innerHTML = "<div class='suivi-msg'>" + t + "</div>"; };
  document.getElementById("theme").onclick = () => {
    const sombre = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = sombre ? "light" : "dark";
  };
  (async function () {
    let local = {};
    try { local = JSON.parse(document.getElementById("donnees-suivi").textContent || "{}"); } catch (e) { local = {}; }
    if (local && local.comptes) { SuiviResultats.dessiner(zone, local); return; }
    const cle = cleDuLien();
    if (!cle) { message("Lien incomplet : il manque la fin du lien (après le #). Prends le lien du tableau et remplace « tableau/ » par « tableau/suivi.html »."); return; }
    try {
      const r = await fetch(DONNEES + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      SuiviResultats.dessiner(zone, await dechiffrer(cle, await r.text()));
    } catch (e) {
      message(String(e.message) === "clé fausse" ? "Lien faux : la clé ne correspond pas." : "Données pas encore disponibles (" + String(e.message).replace(/[<>&]/g, "") + "). Réessaie dans quelques minutes.");
    }
  })();
})();
</script>
