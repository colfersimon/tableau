<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Suivi des résultats</title>
<!-- 30/10 : page autonome du suivi. NE PAS ÉDITER suivi.html : il est refait par construire.py à partir de ce modèle
     + suivi_bloc.css + suivi_bloc.js (le même bloc que l'onglet du simulateur). -->
<style>
:root { color-scheme: light; --page-fond: #f6f5f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme: dark; --page-fond: #121211; } }
:root[data-theme="dark"] { color-scheme: dark; --page-fond: #121211; }
body { margin: 0; background: var(--page-fond); }
.page { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
.page h1 { font: 700 1.35rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0 0 4px; }
.theme { float: right; font: .8rem -apple-system, sans-serif; border: 1px solid #8884; background: transparent; color: inherit; border-radius: 8px; padding: 4px 8px; cursor: pointer; }
/* 30/10 : bloc « Suivi des résultats » (chantier_3010/suivi). Tout est préfixé suivi- et rangé sous .suivi-racine :
   rien ne fuit dans la page qui l'accueille. Couleurs : jetons --suivi-* (clair, sombre par le système ou data-theme). */
.suivi-racine {
  color-scheme: light;
  --suivi-fond: #f6f5f2; --suivi-carte: #fcfcfb; --suivi-trait: #e4e2dc; --suivi-texte: #0b0b0b; --suivi-texte-2: #52514e;
  --suivi-texte-3: #6e6d68; --suivi-gain: #0f7b3a; --suivi-perte: #c8302f; --suivi-teinte: #eeece6; --suivi-rouge: #d4342f;
  --suivi-s1: #2a78d6; --suivi-s2: #eb6834; --suivi-s3: #1baf7a; --suivi-neutre: #b9b7b0;
  color: var(--suivi-texte); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .suivi-racine {
    color-scheme: dark;
    --suivi-fond: #121211; --suivi-carte: #1a1a19; --suivi-trait: #2e2e2c; --suivi-texte: #f0efec; --suivi-texte-2: #c3c2b7;
    --suivi-texte-3: #8f8e86; --suivi-gain: #3fbf6f; --suivi-perte: #ef6b6a; --suivi-teinte: #242422; --suivi-rouge: #ff7a75;
    --suivi-s1: #3987e5; --suivi-s2: #d95926; --suivi-s3: #199e70; --suivi-neutre: #55544f;
  }
}
:root[data-theme="dark"] .suivi-racine {
  color-scheme: dark;
  --suivi-fond: #121211; --suivi-carte: #1a1a19; --suivi-trait: #2e2e2c; --suivi-texte: #f0efec; --suivi-texte-2: #c3c2b7;
  --suivi-texte-3: #8f8e86; --suivi-gain: #3fbf6f; --suivi-perte: #ef6b6a; --suivi-teinte: #242422; --suivi-rouge: #ff7a75;
  --suivi-s1: #3987e5; --suivi-s2: #d95926; --suivi-s3: #199e70; --suivi-neutre: #55544f;
}
.suivi-racine *, .suivi-racine *::before, .suivi-racine *::after { box-sizing: border-box; }
.suivi-racine h2 { font-size: 1.05rem; margin: 0 0 8px; }
.suivi-racine p { margin: 0; }
.suivi-sous { color: var(--suivi-texte-3); font-size: .8rem; }
.suivi-carte { background: var(--suivi-carte); border: 1px solid var(--suivi-trait); border-radius: 16px; padding: 14px 16px; margin-top: 12px; min-width: 0; }
.suivi-choix { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.suivi-choix button { font: inherit; font-size: .88rem; padding: 7px 11px; border-radius: 10px; border: 1px solid var(--suivi-trait); background: var(--suivi-carte); color: var(--suivi-texte); cursor: pointer; }
.suivi-choix button[aria-pressed="true"] { background: var(--suivi-texte); color: var(--suivi-carte); border-color: var(--suivi-texte); font-weight: 700; }
.suivi-jour { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.suivi-jour button { font: inherit; width: 40px; height: 36px; border-radius: 10px; border: 1px solid var(--suivi-trait); background: var(--suivi-carte); color: var(--suivi-texte); cursor: pointer; }
.suivi-jour select { font: inherit; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--suivi-trait); background: var(--suivi-carte); color: var(--suivi-texte); flex: 1; min-width: 0; }
.suivi-diag { font-size: 1.08rem; font-weight: 700; }
.suivi-diag small { display: block; font-weight: 400; color: var(--suivi-texte-2); font-size: .85rem; margin-top: 4px; }
.suivi-tuiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 560px) { .suivi-tuiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.suivi-tuile small { display: block; font-size: .72rem; color: var(--suivi-texte-3); text-transform: uppercase; letter-spacing: .04em; }
.suivi-tuile b { font-size: 1.2rem; font-variant-numeric: tabular-nums; }
.suivi-tuile span { display: block; font-size: .75rem; color: var(--suivi-texte-3); }
.suivi-large { grid-column: 1 / -1; }
.suivi-gain { color: var(--suivi-gain); } .suivi-perte { color: var(--suivi-perte); }
.suivi-ligne { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--suivi-trait); font-variant-numeric: tabular-nums; }
.suivi-ligne.suivi-premiere { border-top: 0; }
.suivi-ligne .suivi-nom { color: var(--suivi-texte-2); }
.suivi-ligne.suivi-total { font-weight: 700; }
.suivi-chance { padding: 10px 0; border-top: 1px solid var(--suivi-trait); }
.suivi-chance.suivi-premiere { border-top: 0; }
.suivi-tete { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.suivi-z { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.suivi-chance p { font-size: .85rem; color: var(--suivi-texte-2); }
.suivi-jauge { position: relative; height: 10px; border-radius: 5px; margin: 8px 0 4px;
  background: linear-gradient(90deg, var(--suivi-perte) 0%, var(--suivi-neutre) 33%, var(--suivi-neutre) 67%, var(--suivi-gain) 100%); }
.suivi-jauge i { position: absolute; top: -4px; width: 4px; height: 18px; border-radius: 2px; background: var(--suivi-texte); box-shadow: 0 0 0 2px var(--suivi-carte); transform: translateX(-2px); }
.suivi-reperes { display: flex; justify-content: space-between; font-size: .68rem; color: var(--suivi-texte-3); }
.suivi-legende { display: flex; gap: 2px 14px; flex-wrap: wrap; font-size: .8rem; color: var(--suivi-texte-2); margin-bottom: 6px; }
.suivi-legende i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
.suivi-legende > span { white-space: nowrap; }
.suivi-legende b { font-weight: 650; font-variant-numeric: tabular-nums; }
.suivi-graphe { position: relative; }
.suivi-graphe svg { width: 100%; height: auto; display: block; touch-action: pan-y; overflow: visible; }
.suivi-graphe svg:focus { outline: none; }
.suivi-graphe svg:focus-visible { outline: 2px solid var(--suivi-s1); outline-offset: 2px; border-radius: 6px; }
.suivi-graphe text { font: 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: var(--suivi-texte-3); font-variant-numeric: tabular-nums; }
.suivi-graphe text.suivi-t0 { fill: var(--suivi-texte-2); font-weight: 600; }
.suivi-graphe text.suivi-fin { font-size: 12.5px; font-weight: 650; fill: var(--suivi-texte); }
.suivi-bulle { position: absolute; pointer-events: none; z-index: 2; background: var(--suivi-carte); border: 1px solid var(--suivi-trait); border-radius: 10px; padding: 8px 10px; min-width: 150px;
  font-size: .8125rem; box-shadow: 0 4px 14px rgba(0,0,0,.18); display: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
.suivi-bd { color: var(--suivi-texte-2); margin-bottom: 4px; }
.suivi-br { display: flex; align-items: center; gap: 6px; }
.suivi-br b { margin-left: auto; padding-left: 12px; font-weight: 650; }
.suivi-br i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; flex: none; }
.suivi-racine table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.suivi-racine th, .suivi-racine td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--suivi-trait); }
.suivi-racine th:first-child, .suivi-racine td:first-child { text-align: left; }
.suivi-racine th { font-size: .72rem; color: var(--suivi-texte-3); font-weight: 600; text-transform: uppercase; border-top: 0; }
.suivi-defile { overflow-x: auto; }
.suivi-setup { padding: 8px 0; border-top: 1px solid var(--suivi-trait); font-size: .88rem; }
.suivi-setup.suivi-premiere { border-top: 0; }
.suivi-haut { display: flex; justify-content: space-between; gap: 8px; }
.suivi-bas { color: var(--suivi-texte-2); font-size: .8rem; }
.suivi-c { font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.suivi-rouge { color: var(--suivi-rouge); }
.suivi-item { padding: 8px 0; border-top: 1px solid var(--suivi-trait); font-size: .88rem; }
.suivi-item.suivi-premiere { border-top: 0; }
.suivi-item b { font-variant-numeric: tabular-nums; }
.suivi-lex p { font-size: .85rem; color: var(--suivi-texte-2); padding: 3px 0; }
.suivi-lex b { color: var(--suivi-texte); }
.suivi-msg { padding: 14px; border-radius: 12px; background: var(--suivi-teinte); margin-top: 12px; }
.suivi-attente { color: var(--suivi-texte-3); font-style: italic; }
.suivi-ligne b, .suivi-z, .suivi-tuile b { white-space: nowrap; }   /* 30/10 : le « € » ne part jamais seul à la ligne */

</style>
</head>
<body>
<div class="page suivi-racine">
  <button class="theme" id="theme" type="button">Clair / sombre</button>
  <h1>Suivi des résultats</h1>
  <div id="suivi"><div class="suivi-msg">Chargement…</div></div>
</div>
<script type="application/json" id="donnees-suivi">{}</script>
<script>
/* 30/10 : bloc « Suivi des résultats » (chantier_3010/suivi), branchable n'importe où.
   Usage : SuiviResultats.dessiner(conteneur, donnees)   (donnees = publie/suivi.json, produit par construire.py)
   Aucune librairie, aucun id global : tout se cherche dans le conteneur. Classes CSS : suivi_bloc.css (préfixe suivi-).
   Les choix (compte, période) sont gardés dans localStorage si permis (try/catch : jamais de plantage).
   Brancher dans une autre page (ex. onglet du simulateur), dans cet ordre :
     1. une balise style avec le contenu de suivi_bloc.css ;
     2. une balise script type="application/json" id="donnees-suivi" contenant {} (construire.py la remplit seul) ;
     3. une balise script avec le contenu de ce fichier ;
     4. SuiviResultats.dessiner(conteneur, JSON.parse(document.getElementById("donnees-suivi").textContent)). */
(function () {
  "use strict";
  const PERIODES = [["jour", "Jour", 1], ["sem", "7 jours", 7], ["mois", "30 jours", 30], ["t90", "90 jours", 90], ["m6", "6 mois", 182], ["an", "1 an", 365]];
  const COMPTES = [["simon", "Simon"], ["mathieu", "Mathieu"], ["les2", "Les deux"]];
  const ADD = ["n", "mises", "net", "jeu", "tapis", "mult", "vt", "vm", "h", "v", "naj", "aj", "aj2", "nhh", "mains", "sdev", "seur", "p2", "nset", "pj2", "j0", "psum", "pm", "g10", "g10a"];
  const JOURS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const CARTE = { h: "♥", d: "♦", c: "♣", s: "♠" };

  // ---------------------------------------------------------------- petits outils
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const signe = x => x > 0 ? "+" : x < 0 ? "−" : "";
  const nb = (x, d) => x == null || !isFinite(x) ? "–" : signe(x) + Math.abs(x).toFixed(d).replace(".", ",");
  const nbs = (x, d) => x == null || !isFinite(x) ? "–" : (x < 0 ? "−" : "") + Math.abs(x).toFixed(d).replace(".", ",");
  const eur = (x, d) => x == null || !isFinite(x) ? "–" : nb(x, d == null ? 2 : d) + " €";
  const cls = x => x > 0 ? "suivi-gain" : x < 0 ? "suivi-perte" : "";
  const ent = x => Math.round(x).toLocaleString("fr-FR");
  const dateFr = d => d.slice(8, 10) + "/" + d.slice(5, 7);
  const jourSem = d => JOURS[new Date(d + "T12:00:00").getDay()];
  const premier = i => i === 0 ? " suivi-premiere" : "";
  function phi(z) {                                     // loi normale : part des cas sous z
    const t = 1 / (1 + 0.2316419 * Math.abs(z)), y = Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI);
    const p = y * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
    return z >= 0 ? 1 - p : p;
  }
  function ajouteJours(d, k) { const x = new Date(d + "T12:00:00"); x.setDate(x.getDate() + k); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); }
  const cartes = t => !t ? "" : t.split(" ").map(c => "<span class='suivi-c" + ("hd".includes(c[1]) ? " suivi-rouge" : "") + "'>" + (c[0] === "T" ? "10" : c[0]) + CARTE[c[1]] + "</span>").join(" ");

  // ---------------------------------------------------------------- calculs (une seule fonction par notion)
  function vide() { const o = {}; ADD.forEach(k => o[k] = 0); o.mv = {}; o.ma = {}; o.sessions = []; o.pires = []; o.meilleurs = []; return o; }
  function ajoute(a, j, nomCompte) {
    ADD.forEach(k => a[k] += j[k] || 0);
    for (const k in j.mv || {}) a.mv[k] = (a.mv[k] || 0) + j.mv[k];
    for (const k in j.ma || {}) a.ma[k] = (a.ma[k] || 0) + j.ma[k];
    (j.sessions || []).forEach(s => a.sessions.push(Object.assign({ compte: nomCompte }, s)));
    a.pires = a.pires.concat(j.pires || []); a.meilleurs = a.meilleurs.concat(j.meilleurs || []);
    return a;
  }
  // chiffres dérivés d'un groupe de tournois (session, jour, période)
  function calcule(a, B) {
    const r = Object.assign({}, a);
    r.roi = a.mises ? a.net / a.mises : null;
    r.parH = a.h > 0.05 ? a.net / a.h : null;
    r.cev = a.naj ? a.aj / a.naj : null;
    const sd = a.naj > 1 ? Math.sqrt(Math.max(0, (a.aj2 - a.aj * a.aj / a.naj) / (a.naj - 1))) : null;
    r.ic = sd != null ? 1.96 * sd / Math.sqrt(a.naj) : null;
    r.zT = a.vt > 0 ? a.tapis / Math.sqrt(a.vt) : null;
    r.zM = a.vm > 0 ? a.mult / Math.sqrt(a.vm) : null;
    r.zS = a.nhh > 0 && a.p2 > 0 && B && B.sigma ? a.seur / (B.sigma * Math.sqrt(a.p2)) : null;   // en € : signe = signe du montant
    r.setupsEur = a.nhh > 0 ? a.seur : null;
    r.cevHors = r.cev != null && a.nhh > 0 ? r.cev - a.sdev / a.nhh : null;
    r.jeuHors = a.nhh > 0 ? a.jeu - a.seur : null;            // = réel sans la chance
    r.couv = a.n ? a.nhh / a.n : 0;
    // 30/10 (relecture) : UN seul « jeu » (hors setups quand les mains sont lues), sa fourchette à 95 %, le point mort
    // de la mise jouée, et la part de chance des cartes quand la cEV sort très au-dessus (ou au-dessous) de la normale
    r.jeuUn = r.jeuHors != null ? r.jeuHors : a.jeu;
    r.chance = a.net - r.jeuUn;
    r.pm = a.n ? a.pm / a.n : null;
    const sdT = B && B.sd_aj ? B.sd_aj : sd;
    r.icJeu = sdT && a.pj2 > 0 ? 1.96 * sdT * Math.sqrt(a.pj2) : null;
    r.jeuMoy = B && B.cev_moy != null ? a.j0 + B.cev_moy * a.psum : null;
    r.zCev = sdT && a.naj > 0 && B && B.cev_moy != null ? (r.cev - B.cev_moy) / (sdT / Math.sqrt(a.naj)) : null;
    r.cartes = r.zCev != null && Math.abs(r.zCev) >= 1 && r.jeuMoy != null ? a.jeu - r.jeuMoy : null;   // cEV à plus d'1 écart-type de la moyenne
    return r;
  }
  function verdictJeu(c, pm) {                          // pm = point mort de la mise jouée (0,25 € : +45 ; 1-2-5 € : +38)
    if (c == null) return "jeu non mesuré";
    if (pm == null) pm = 38;
    if (c >= pm + 22) return "bon jeu";
    if (c >= pm) return "jeu correct";
    if (c >= 0) return "jeu sous le point mort";
    return "jeu perdant";
  }
  // LA phrase de diagnostic : « Jour perdant à cause des setups (−2,1) et des tapis (−1,4), jeu correct (cEV +70) »
  function diagnostic(r, mot) {
    const e = mot === "Période" ? "e" : "";
    const g = r.net > 0.005 ? mot + " gagnant" + e : r.net < -0.005 ? mot + " perdant" + e : mot + " à zéro";
    // 30/10 (relecture) : en € et en part du gain. « +112 € = 29 € de jeu + 84 € de chance (multiplicateurs +54, ...) »
    let t = (r.incomplet || (r.etat || []).some(e => !e.complet) ? "Jour incomplet · " : "") + g + " : " + eur(r.net, 0) + " = " + nbs(r.jeuUn, 0) + " € de jeu " +
      (r.chance >= 0 ? "+ " : "− ") + Math.abs(r.chance).toFixed(0) + " € de chance";        // le détail : cartes « chance » juste dessous
    if (Math.abs(r.net) >= 1) t += Math.abs(r.chance) > Math.abs(r.net) / 2 ? " : surtout de la chance" : " : surtout du jeu";
    const c = r.cevHors != null ? r.cevHors : r.cev;
    t += ". " + verdictJeu(c, r.pm)[0].toUpperCase() + verdictJeu(c, r.pm).slice(1) + " (cEV " + nb(c, 0) + ", point mort " + nb(r.pm, 0) + ")";
    if (r.zS == null) t += ", setups en attente";
    return t;
  }
  // Benjamini-Hochberg (10 %) sur tous les scores de chance des jours de la période
  function joursHorsNormes(jours, B) {
    const tests = [];
    for (const j of jours) {
      const r = calcule(j, B);
      [["setups", r.zS], ["tapis", r.zT], ["multiplicateurs", r.zM]].forEach(([n, z]) => { if (z != null) tests.push({ d: j.date, n, z, p: 2 * (1 - phi(Math.abs(z))) }); });
    }
    tests.sort((a, b) => a.p - b.p);
    let k = 0;
    tests.forEach((t, i) => { if (t.p <= 0.10 * (i + 1) / tests.length) k = i + 1; });
    return { n: tests.length, retenus: tests.slice(0, k) };
  }

  // ---------------------------------------------------------------- morceaux de page
  function chance(nom, expl, z, euros, i) {
    if (z == null) return "<div class='suivi-chance" + premier(i) + "'><div class='suivi-tete'><b>" + nom + "</b><span class='suivi-z suivi-attente'>en attente</span></div><p>" + expl + "</p><p class='suivi-attente'>Mains pas encore lues pour cette période : pas de chiffre (ce n'est pas 0).</p></div>";
    const pos = Math.max(0, Math.min(100, (z + 3) / 6 * 100));
    const mot = Math.abs(z) < 1 ? "normal" : z >= 2 ? "très chanceux" : z >= 1 ? "chanceux" : z <= -2 ? "très malchanceux" : "malchanceux";
    return "<div class='suivi-chance" + premier(i) + "'><div class='suivi-tete'><b>" + nom + "</b><span class='suivi-z " + cls(euros) + "'>" + eur(euros, 0) + "</span></div>" +
      "<div class='suivi-jauge' role='img' aria-label='" + nom + " " + nb(z, 1) + "'><i style='left:" + pos.toFixed(1) + "%'></i></div>" +
      "<div class='suivi-reperes'><span>très malchanceux</span><span>normal</span><span>très chanceux</span></div>" +
      "<p><b>" + mot[0].toUpperCase() + mot.slice(1) + "</b>. " + expl + "</p></div>";
  }
  const SERIES = [["Réel", "net", "var(--suivi-s1)", ""], ["Réel sans la chance (le jeu)", "sans", "var(--suivi-s3)", "6 4"]];
  const NS = "http://www.w3.org/2000/svg";
  const NBSP = " ";
  const eurAxe = v => nbs(v, 0) + NBSP + "€";
  // axe vertical : repères ronds, zéro toujours dedans, un peu d'air sous le plus bas et au-dessus du plus haut
  function echelleCourbe(lo, hi) {
    const span = (hi - lo) || 1, brut = span / 4, p = Math.pow(10, Math.floor(Math.log10(brut))), f = brut / p;
    const pas = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const dmin = lo - span * 0.06, dmax = hi + span * 0.08, ticks = [];
    for (let v = Math.ceil(dmin / pas - 1e-9) * pas; v <= dmax + 1e-9; v += pas) ticks.push(Math.round(v * 1000) / 1000);
    return { ticks, dmin, dmax };
  }
  function courbe(points) {
    if (points.length < 2) return { html: "<p class='suivi-sous'>Courbe : il faut au moins 2 points (2 sessions ou 2 jours).</p>" };

        "aria-label": "Courbe cumulée en euros : " + SERIES.map(s => s[0] + " " + (c.finale(s) === null ? "en attente" : eur(c.finale(s)))).join(", ") + ". Flèches gauche et droite pour parcourir." });

          return "<div class='suivi-br'><i style='border-color:" + s[2] + ";border-top-style:" + (s[3] ? "dashed" : "solid") + "'></i><span>" + (s[1] === "net" ? "Réel" : "Sans la chance") + "</span><b class='" + (isFinite(v) ? cls(v) : "suivi-attente") + "'>" + (isFinite(v) ? eur(v) : "en attente") + "</b></div>"; }).join("");

  function multiplicateurs(r) {

      if (unJour) {
        h += "<div class='suivi-carte'><h2>Les sessions</h2><div class='suivi-defile'><table><tr><th>Session</th><th>Tournois</th><th>Réel</th><th>Jeu</th><th>Setups</th><th>Tapis</th><th>Mult.</th><th>cEV</th></tr>" +
          r.sessions.map(s => { const c = calcule(Object.assign(vide(), s), B); return "<tr><td>" + esc((deux ? s.compte + " " : "") + (s.id === "hors session" ? "fin de session pas encore rangée" : s.debut + (s.direct ? " (résumé)" : ""))) + "</td><td>" + s.n + "</td><td class='" + cls(s.net) + "'>" + nb(s.net, 1) + "</td><td>" + nb(c.jeuUn, 1) + "</td><td>" + (c.setupsEur == null ? "<span class='suivi-attente'>attente</span>" : nb(c.setupsEur, 1)) + "</td><td>" + nb(s.tapis, 1) + "</td><td>" + nb(s.mult, 1) + "</td><td>" + nb(c.cev, 0) + "</td></tr>"; }).join("") +
          "</table></div><p class='suivi-sous'>En €. Jeu = hors setups. Sur téléphone, faire glisser le tableau de côté.</p></div>";
      } else {
        const bh = joursHorsNormes(jours, B);
        h += "<div class='suivi-carte'><h2>Jour par jour</h2>" + jours.slice().reverse().map((j, i) => "<div class='suivi-item" + premier(i) + "'><b>" + jourSem(j.date) + " " + dateFr(j.date) + " · <span class='" + cls(j.net) + "'>" + eur(j.net) + "</span></b> · " + j.n + " tournois<br>" + esc(diagnostic(calcule(j, B), "Jour")) + "</div>").join("") +
          "<p class='suivi-sous' style='margin-top:8px'>Vraiment hors normes après correction pour " + bh.n + " tests (méthode Benjamini-Hochberg, 10 %) : " +
          (bh.retenus.length ? bh.retenus.map(t => dateFr(t.d) + " " + t.n + " (" + nb(t.z, 1) + ")").join(", ") : "aucun. Les écarts vus restent dans ce que le hasard produit sur autant de jours.") + "</p></div>";
      }
      h += "<div class='suivi-carte'><h2>Multiplicateurs : tirés contre attendus</h2>" + multiplicateurs(r) + "</div>";
      // 30/10 : lexique retiré (demande de Simon)
      C.innerHTML = h;
      brancherBulle(racine, cb);
    }
    q("date").onchange = e => { etat.date = e.target.value; rendu(); };
    const pas = k => { const ds = toutesDates(), i = ds.indexOf(etat.date) + k; if (i >= 0 && i < ds.length) { etat.date = ds[i]; rendu(); } };
    q("avant").onclick = () => pas(-1);
    q("apres").onclick = () => pas(1);
    rendu();
  }

  window.SuiviResultats = { dessiner, calcule, diagnostic };
})();

</script>
<script>
(function () {
  "use strict";
  const DONNEES = "https://raw.githubusercontent.com/colfersimon/tableau/donnees/suivi.enc";
  const zone = document.getElementById("suivi");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  function cleDuLien() {
    const h = location.hash.replace(/^#/, "").replace(/-/g, "+").replace(/_/g, "/");
    try { const k = b64(h + "===".slice((h.length + 3) % 4)); return k.length === 64 ? k : null; } catch (e) { return null; }
  }
  async function dechiffrer(cle, texte) {          // même format que le lien fixe (AES-256-CBC + HMAC-SHA256)
    const d = JSON.parse(texte), iv = b64(d.iv), ct = b64(d.ct), mac = b64(d.mac);
    const kMac = await crypto.subtle.importKey("raw", cle.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    const tout = new Uint8Array(iv.length + ct.length); tout.set(iv); tout.set(ct, iv.length);
    if (!await crypto.subtle.verify("HMAC", kMac, mac, tout)) throw new Error("clé fausse");
    const kAes = await crypto.subtle.importKey("raw", cle.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, kAes, ct)));
  }
  const message = t => { zone.innerHTML = "<div class='suivi-msg'>" + t + "</div>"; };
  document.getElementById("theme").onclick = () => {
    const sombre = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = sombre ? "light" : "dark";
  };
  (async function () {
    let local = {};
    try { local = JSON.parse(document.getElementById("donnees-suivi").textContent || "{}"); } catch (e) { local = {}; }
    if (local && local.comptes) { SuiviResultats.dessiner(zone, local); return; }
    const cle = cleDuLien();
    if (!cle) { message("Lien incomplet : il manque la fin du lien (après le #). Prends le lien du tableau et remplace « tableau/ » par « tableau/suivi.html »."); return; }
    try {
      const r = await fetch(DONNEES + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      SuiviResultats.dessiner(zone, await dechiffrer(cle, await r.text()));
    } catch (e) {
      message(String(e.message) === "clé fausse" ? "Lien faux : la clé ne correspond pas." : "Données pas encore disponibles (" + String(e.message).replace(/[<>&]/g, "") + "). Réessaie dans quelques minutes.");
    }
  })();
})();
</script>
