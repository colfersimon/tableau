<title>Carnet</title>
<style>
  :root {
    color-scheme: light;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0f0f0e; --carte: #1a1a19; --teinte: #232321; --trait: #2c2c2a; --trait-fort: #42423e;
      --texte: #f0efec; --texte-2: #c3c2b7; --texte-3: #9d9c92;
      --gain: #4cc561; --perte: #f27d73; --info: #86b6ef; --alerte-fond: #2e2810; --alerte-trait: #8a6d12;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f0f0e; --carte: #1a1a19; --teinte: #232321; --trait: #2c2c2a; --trait-fort: #42423e;
    --texte: #f0efec; --texte-2: #c3c2b7; --texte-3: #9d9c92;
    --gain: #4cc561; --perte: #f27d73; --info: #86b6ef; --alerte-fond: #2e2810; --alerte-trait: #8a6d12;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--page); color: var(--texte); font: 16px/1.4 var(--sans); }

  .icone svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .bandeau { margin: 0 0 12px; padding: 10px 12px; border: 1px solid var(--alerte-trait); background: var(--alerte-fond); border-radius: 12px; font-size: .875rem; }
  .bandeau p + p { margin-top: 4px; }

  .filtres { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { min-height: 44px; padding: 0 12px; border: 1px solid var(--trait-fort); border-radius: 22px; background: var(--carte); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .chip[aria-pressed="true"] { background: var(--texte); color: var(--page); border-color: var(--texte); font-weight: 600; }
  .cle { display: inline-block; width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--trait-fort); font-size: .6875rem; line-height: 1.5; color: var(--texte-2); font-weight: 500; white-space: nowrap; }
  .chip[aria-pressed="true"] .tag { color: var(--page); border-color: currentColor; }
  .tag.ex { border-color: var(--alerte-trait); background: var(--alerte-fond); color: var(--texte); }

  .carte { background: var(--carte); border: 1px solid var(--trait); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .carte h2 { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
  .carte.tabcarte { padding: 16px 8px 12px; }
  .carte.tabcarte > h2, .carte.tabcarte > .doux, .carte.tabcarte > .plus { margin-left: 8px; }

  .chiffres { background: var(--carte); border: 1px solid var(--trait); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
  .portee { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; color: var(--texte-2); font-size: .875rem; }
  .hero .gros { font-size: 3rem; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 2px; }
  .hero .gros.mot { font-size: 2rem; color: var(--texte-2); font-weight: 600; }
  .sous { color: var(--texte-2); font-size: .875rem; }
  .tuiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--trait); }
  .tuile .lbl { color: var(--texte-2); font-size: .8125rem; }
  .tuile .val { font-size: 1.5rem; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; margin-top: 2px; }
  .tuile .sous { font-size: .75rem; margin-top: 2px; }
  .lignes { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--trait); display: grid; gap: 6px; font-size: .875rem; color: var(--texte-2); }
  .lignes .nom { color: var(--texte); font-weight: 600; }
  .lignes .item { display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; white-space: nowrap; }
  .plus-v { color: var(--gain); } .moins-v { color: var(--perte); }

  .legende { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-bottom: 8px; font-size: .875rem; }
  .legende .li { display: inline-flex; align-items: center; gap: 6px; }
  .legende .cle { width: 16px; height: 3px; }
  #courbe { position: relative; }
  #courbe svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
  #courbe text { font: 11.5px var(--sans); fill: var(--texte-3); font-variant-numeric: tabular-nums; }
  #courbe text.zero { fill: var(--texte-2); font-weight: 600; }
  #courbe text.fin { font: 650 12.5px var(--sans); fill: var(--texte); }
  #courbe svg:focus { outline: none; }
  #courbe svg:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 6px; }
  .tip { position: absolute; top: 0; z-index: 2; pointer-events: none; min-width: 150px; max-width: 220px; padding: 8px 10px; border: 1px solid var(--trait-fort); border-radius: 10px; background: var(--carte); box-shadow: 0 4px 14px rgba(0, 0, 0, .18); font-size: .8125rem; }
  .tip .date { color: var(--texte-2); margin-bottom: 4px; }
  .tip .r { display: flex; align-items: center; gap: 6px; }
  .tip .r b { font-weight: 650; margin-left: auto; padding-left: 10px; font-variant-numeric: tabular-nums; }
  .tip .cle { width: 12px; }
  .vide { color: var(--texte-2); padding: 12px 0; }

  .defile { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  .tab { min-width: 100%; }
  .lig { display: grid; align-items: stretch; justify-content: start; border-bottom: 1px solid var(--trait); }
  .lig.tete { background: var(--carte); font-size: .8125rem; color: var(--texte-2); border-bottom-color: var(--trait-fort); }
  .lig.tete > div { padding: 8px 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .jr { padding: 8px 4px 8px 6px; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
  .jr .sem { color: var(--texte-2); font-size: .75rem; }
  .jr .dt { font-weight: 650; font-variant-numeric: tabular-nums; }
  .jr .auj { color: var(--info); font-size: .625rem; font-weight: 600; white-space: nowrap; }
  .col-total { background: var(--teinte); }
  .cel { display: flex; flex-direction: column; justify-content: center; gap: 2px; width: 100%; min-height: 56px; padding: 8px 4px; border: 0; border-radius: 0; background: transparent; text-align: left; cursor: pointer; }
  .cel:hover { background: var(--teinte); }
  .col-total .cel:hover { background: var(--trait); }

  .cel .pt { color: var(--texte-2); font-size: .75rem; font-variant-numeric: tabular-nums; }
  .cel .net .tilde { color: var(--texte-2); font-weight: 500; margin-left: 3px; }
  .cel.etat { color: var(--texte-2); font-size: .8125rem; }

  .cel .mini { font-size: .6875rem; color: var(--texte-2); }
  .detail { display: block; border-bottom: 1px solid var(--trait-fort); background: var(--teinte); }
  .panneau { position: sticky; left: 0; padding: 14px 12px 16px; width: var(--larg, 100%); max-width: 100%; }
  .panneau > * { max-width: 640px; }
  .panneau h3 { font-size: 1rem; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .panneau h4 { font-size: .8125rem; font-weight: 650; color: var(--texte-2); margin: 14px 0 4px; }
  .faits { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; margin: 12px 0 0; }

  .sess { list-style: none; margin: 0; padding: 0; font-size: .8125rem; font-variant-numeric: tabular-nums; }

  .sess li:first-child { border-top: 0; }
  .sess .sub { grid-column: 1 / -1; color: var(--texte-2); font-size: .75rem; }
  .note { margin-top: 12px; font-size: .8125rem; color: var(--texte-2); }
  .plus { margin-top: 12px; min-height: 44px; padding: 0 16px; border: 1px solid var(--trait-fort); border-radius: 22px; background: var(--carte); cursor: pointer; }

  .pied { margin-top: 8px; color: var(--texte-2); font-size: .8125rem; }
  .pied h2 { font-size: .875rem; color: var(--texte); margin-bottom: 6px; }
  .pied ul { margin: 0 0 12px; padding-left: 18px; }
  .pied li { margin-bottom: 3px; }

  @media (min-width: 640px) {
    .page { padding-top: 24px; }
    h1 { font-size: 1.5rem; }
    .tuile .val { font-size: 1.875rem; }
    .faits { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .filtres { flex-direction: row; justify-content: space-between; flex-wrap: wrap; }
  }
  @media (max-width: 380px) { .hero .gros { font-size: 2.75rem; } .tuile .val { font-size: 1.3rem; } }
  .auj { margin-bottom: 16px; }
  .auj .auj-hero { background: var(--carte); border: 1px solid var(--trait); border-radius: 16px; padding: 18px 16px; text-align: center; }
  .auj .auj-t { color: var(--texte-2); font-size: .8125rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  .auj .auj-gros { font-size: clamp(3.4rem, 15vw, 5.5rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.05; margin: 8px 0 10px; }
  .auj .auj-gros.mot { font-size: 2.2rem; color: var(--texte-2); }
  .auj .auj-cpt { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px; font-size: 1.15rem; font-weight: 600; }
  .auj .auj-cpt .cle { margin-right: 6px; }
  .auj .auj-sous { color: var(--texte-2); font-size: .875rem; margin-top: 8px; }
  .auj .auj-per { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .auj .auj-per > div { background: var(--carte); border: 1px solid var(--trait); border-radius: 14px; padding: 12px; min-width: 0; }
  .auj .auj-per .lbl { color: var(--texte-2); font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .auj .auj-per .val { font-size: 1.35rem; font-weight: 750; margin: 2px 0; white-space: nowrap; }
  .auj .auj-per .sous { color: var(--texte-2); font-size: .75rem; line-height: 1.5; }
  @media (max-width: 640px) { .auj .auj-per { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<body>
<div class="page">
  <header class="haut">
    <div>
      <h1>Tableau de bord global</h1>
      <p class="doux" id="maj">chargement</p>
    </div>
    <button class="icone" id="theme" type="button" aria-label="Changer de thème (automatique, sombre, clair)" title="Thème">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </header>

  <div class="bandeau" id="bandeau" hidden></div>

  <!-- 29/10 (Simon : « aujourd'hui on a fait combien » doit sauter aux yeux) : toujours tous les comptes, sans filtre -->

  <nav class="filtres" aria-label="Filtres">

  </nav>

  <main>
    <section class="chiffres" id="chiffres" aria-label="Chiffres clés"></section>

    <section class="carte" aria-labelledby="t-courbe">
      <h2 id="t-courbe">Résultat cumulé</h2>
      <div class="legende" id="legende"></div>
      <div id="courbe"></div>
    </section>

    <section class="carte tabcarte" aria-labelledby="t-jours">
      <h2 id="t-jours">Jour par jour</h2>
      <p class="doux" style="margin-top:-6px;margin-bottom:8px">Touche une case pour voir le détail.</p>
      <div class="defile" id="defile"><div class="tab" id="jours" role="table" aria-label="Résultat par jour et par compte"></div></div>
      <button class="plus" id="plus" type="button" hidden>Voir plus de jours</button>
    </section>
  </main>

  <footer class="pied" id="pied"></footer>
</div>

<script type="text/plain" id="logique">
/* Calculs purs (pas de page) : testés par test_global.py avec node, comparés à global.py. */
(function (racine) {
  'use strict';
  function somme(v) { var s = 0, ok = false; v.forEach(function (x) { if (x !== null && x !== undefined) { s += x; ok = true; } }); return ok ? s : null; }

  /* Les dates visibles : les `periode` derniers jours (0 = tout). */
  function dates(data, periode) { return periode > 0 ? data.dates.slice(-periode) : data.dates.slice(); }

  /* Même calcul que `totaliser` de global.py, sur des enregistrements déjà jugés « donnés ». */
  function agreger(recs, seuil) {
    var t = { jours: recs.length };
    t.jours_joues = recs.filter(function (r) { return (r.tournois || 0) > 0; }).length;
    t.sessions = arr(somme(recs.map(function (r) { return r.sessions; })), 0);
    t.jeu_s = arr(somme(recs.map(function (r) { return r.jeu_s; })), 0);
    t.tournois = arr(somme(recs.map(function (r) { return r.tournois; })), 0);
    t.victoires = arr(somme(recs.map(function (r) { return r.victoires; })), 0);
    t.net_eur = arr(somme(recs.map(function (r) { return r.net_eur; })), 2);
    t.buyins_eur = arr(somme(recs.map(function (r) { return r.buyins_eur; })), 2);
    t.cev_total = arr(somme(recs.map(function (r) { return r.cev_total; })), 1);
    t.cev_connus = recs.reduce(function (a, r) { return a + (r.cev_connus || 0); }, 0);
    t.approx = recs.some(function (r) { return r.approx; });
    t.en_cours = recs.some(function (r) { return r.statut === 'en_cours'; });
    t.heures = t.jeu_s === null ? null : arr(t.jeu_s / 3600, 2);
    t.roi = (t.buyins_eur !== null && t.net_eur !== null && t.buyins_eur > 0) ? arr(t.net_eur / t.buyins_eur, 4) : null;
    t.cev_moyen = t.cev_connus ? arr(t.cev_total / t.cev_connus, 1) : null;
    t.ecart_seuil = t.cev_moyen === null ? null : arr(t.cev_moyen - seuil, 1);
    t.cev_fiable = t.cev_connus >= 30;
    t.limites = {};
    recs.forEach(function (r) { Object.keys(r.limites || {}).forEach(function (k) { t.limites[k] = (t.limites[k] || 0) + r.limites[k]; }); });
    return t;
  }

  /* Les enregistrements « donnés » d'un compte (ou du total) sur ces dates. */
  function donnes(data, ids, cible) {
    var set = {}; ids.forEach(function (d) { set[d] = true; });
    return data.jours.filter(function (j) { return set[j.date]; }).map(function (j) {
      return cible === 'total' ? j.total : j.comptes[cible];
    }).filter(function (r) { return r && r.donne; });
  }

  /* Cumul en euros sur les dates visibles : null un jour où le compte n'a pas donné ses chiffres. */
  function cumul(data, ids, cible) {
    var par = {}; data.jours.forEach(function (j) { par[j.date] = j; });
    var c = 0;
    return ids.map(function (d) {
      var j = par[d], r = j && (cible === 'total' ? j.total : j.comptes[cible]);
      if (r && r.donne && r.net_eur !== null) { c = Math.round((c + r.net_eur) * 100) / 100; return c; }
      return null;
    });
  }

  /* Que montrer en haut ? `mode` : 'tous' ou l'id d'un compte. Sans jour commun, la page propose le compte qui a des données. */
  function modeParDefaut(data) {
    if (data.comptes.length < 2 || data.totaux.tous.jours > 0) return 'tous';
    var meilleur = data.comptes[0].id, n = -1;
    data.comptes.forEach(function (c) { var j = data.totaux.par_compte[c.id].jours; if (j > n) { n = j; meilleur = c.id; } });
    return meilleur;
  }

  racine.GlobalLogique = { somme: somme, dates: dates, agreger: agreger, donnes: donnes, cumul: cumul, modeParDefaut: modeParDefaut };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

      let a = null;
      for (const l of (await r.text()).split("\n")) {
        try { const m = JSON.parse(l), u = (m.click || (String(m.message || "").match(/https:\/\/[a-z0-9-]+\.trycloudflare\.com/) || [])[0] || "").replace(/\/$/, "");
          if (RX.test(u)) a = u; } catch (e) { /* ligne vide */ }
      }
      return a;
    } catch (e) { return null; }
  }

  // 27/10 soir : courbe de la session en petit, visible tout de suite sur chaque carte
  function courbe(c) {
    const v = [0].concat(c.map(p => Number(p[1]) || 0)), lo = Math.min(0, ...v), hi = Math.max(0, ...v), e = (hi - lo) || 1;
    const X = i => (i * 300 / (v.length - 1)).toFixed(1), Y = y => (6 + (hi - y) * 58 / e).toFixed(1);
    const fin = v[v.length - 1], coul = fin >= 0 ? "#2fbf71" : "#e5484d";
    return "<div class='lf-courbe'><small>Courbe de la session · " + (c[0][0] || "") + " → " + (c[c.length - 1][0] || "") + "</small>" +
      "<svg viewBox='0 0 300 70' preserveAspectRatio='none' style='width:100%;height:70px;display:block'>" +
      "<line x1='0' x2='300' y1='" + Y(0) + "' y2='" + Y(0) + "' stroke='#888' stroke-width='1' stroke-dasharray='3 3' vector-effect='non-scaling-stroke'/>" +
      "<polyline fill='none' stroke='" + coul + "' stroke-width='2' vector-effect='non-scaling-stroke' points='" +
      v.map((y, i) => X(i) + "," + Y(y)).join(" ") + "'/></svg></div>";
  }

  function carte(id, x, adresse) {
    const nom = NOMS[id] || id, k = document.createElement("div");
    let coul = "lf-gris", etat = "pas de nouvelles";
    if (x) {
      if (x.stop) { etat = "STOP"; }
      else if (x.etat === "EN_SESSION") { coul = x.arme === false ? "lf-rouge" : "lf-vert"; etat = x.arme === false ? "PAS ARMÉ" : "EN JEU"; }
      else if (x.etat === "PAUSE") { coul = "lf-bleu"; etat = "PAUSE"; }
      else if (x.etat === "FIN_DE_CRENEAU") { coul = "lf-vert"; etat = "FINIT SES TABLES"; }
      else etat = "ARRÊTÉ";
    } else coul = "lf-rouge";
    k.className = "lf-carte " + coul;
    const se = (x && x.session) || {}, jo = (x && x.jour) || {};
    k.innerHTML = "<h2><i class='lf-pastille'></i>" + esc(nom) + "<span class='lf-etat'>" + esc(etat) + "</span></h2>" +
      "<div class='lf-texte'>" + (x ? esc(x.texte || x.statut || "") : "Mac éteint ou injoignable : derniers chiffres plus bas.") + "</div>" +
      (x ? "<div class='lf-chiffres'>" +
        (se.active ? "<div><small>Session</small><b class='" + classe(se.net_eur) + "'>" + eur(se.net_eur) + "</b><span class='lf-vu'>" + (se.tournois || 0) + " tournois</span></div>" : "") +
        "<div><small>Aujourd'hui</small><b class='" + classe(jo.net_eur) + "'>" + eur(jo.net_eur) + "</b><span class='lf-vu'>" + (jo.tournois || 0) + " tournois</span></div>" +
        (x.mise != null ? "<div><small>Mise</small><b>" + String(x.mise).replace(".", ",") + " €</b>" + (x.bankroll != null ? "<span class='lf-vu'>bankroll " + Math.round(x.bankroll) + " €</span>" : "") + "</div>" : "") +
        "</div>" : "") +
      (x && x.courbe && x.courbe.length > 1 ? courbe(x.courbe) : "") +
      "<div class='lf-bas'>" + (adresse ? "<a class='lf-bouton' target='_blank' rel='noopener' href='" + adresse + "/#direct'>Tableau en direct ↗</a>" : "") +
      "<span class='lf-vu'>" + (x ? "chiffres de " + hm(x.maj) : "") + (adresse ? " · le bouton marche si son Mac est allumé" : "") + "</span></div>";
    return k;
  }

  function afficherDirect() {
    if (!derniers) return;
    zone.innerHTML = "";
    for (const id of Object.keys(derniers.sujets || NOMS)) {
      const a = adressesNtfy[id] || (derniers.adresses || {})[id] || null;
      zone.append(carte(id, (derniers.direct || {})[id], a));
    }
  }

  function lancerPage(g) {
    document.getElementById("donnees").textContent = JSON.stringify(g);
    for (const nom of ["logique", "ui"]) {
      const s = document.createElement("script");
      s.textContent = document.getElementById(nom).textContent;
      document.body.append(s);
    }
  }

  async function charger(premier) {
    const cle = cleDuLien();
    if (!cle) { message("Lien incomplet : il manque la fin du lien (après le #). Reprends le lien complet."); return; }
    let d;
    try {
      const r = await fetch(DONNEES + "?t=" + Math.floor(Date.now() / 60000), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      d = await dechiffrer(cle, await r.text());
    } catch (e) {
      if (premier) message(String(e.message) === "clé fausse" ? "Lien faux : la clé ne correspond pas." : "Données pas encore disponibles (" + esc(e.message) + "). Réessaie dans 2 min.");
      return;
    }
    derniers = d;
    if (premier) { globalVu = d.global_ && d.global_.maj; lancerPage(d.global_); }
    else if (d.global_ && d.global_.maj !== globalVu && !document.hidden) { location.reload(); return; }
    afficherDirect();
    for (const [id, sujet] of Object.entries(d.sujets || {})) {
      adresseNtfy(sujet).then(a => { if (a) { adressesNtfy[id] = a; afficherDirect(); } });
    }
  }
  charger(true);
  setInterval(() => charger(false), 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) charger(false); });
})();
</script>

</body>
